<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外貿協會公關組 - 媒體採購與預算整合管理系統 (跨年度雲端共編版)</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; }
  </style>
  <link rel="icon" type="image/png" href="./favicon.png">
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ⚠️ 請將下方的網址替換為您部署 Apps Script 後取得的 Web App URL
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzFYzNAij9SbKi83N3lQS5k__dVulfSzjZtoVeqFy7c1P-Gf-7U0F8KecSiw6FDGNtV/exec";

    const PRESET_MEDIA_LIST = [
      "工商時報", "經濟日報", "商業周刊", 
      "自由時報", "聯合報", "中國時報"
    ];

    function App() {
      const [exhibitions, setExhibitions] = useState([]);
      const [mediaKpis, setMediaKpis] = useState([]);
      const [exhibitionAliases, setExhibitionAliases] = useState({}); // 展覽別名對照表
      const [mediaAliases, setMediaAliases] = useState({});         // 媒體別名對照表

      // 全域篩選年度 (預設帶入當前年份或 2027)
      const [selectedYear, setSelectedYear] = useState('2027');

      // 依活動分頁狀態
      const [isKpiSectionExpanded, setIsKpiSectionExpanded] = useState(false);
      const [expandedTimelineMedia, setExpandedTimelineMedia] = useState([]);
      const [expandedExhibitions, setExpandedExhibitions] = useState([]);

      // 拖曳排序狀態
      const [draggedIndex, setDraggedIndex] = useState(null);
      const [dragOverIndex, setDragOverIndex] = useState(null);

      const [activeTab, setActiveTab] = useState('exhibitions'); 
      const [selectedMediaNames, setSelectedMediaNames] = useState([]);

      const [isLoading, setIsLoading] = useState(false);
      const [isSaving, setIsSaving] = useState(false);
      const [syncStatus, setSyncStatus] = useState('已連線至雲端資料庫');

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingExhibition, setEditingExhibition] = useState(null);

      // 編輯 KPI 彈跳視窗
      const [isKpiModalOpen, setIsKpiModalOpen] = useState(false);
      const [editingKpi, setEditingKpi] = useState(null);
      const [kpiForm, setKpiForm] = useState({ name: '', targetKpi: '', year: '2027' });

      const [formData, setFormData] = useState({
        name: '',
        department: '',
        totalBudget: '',
        year: '2027',
        notes: '',
        mediaItems: []
      });

      const [newKpiName, setNewKpiName] = useState('');
      const [newKpiTarget, setNewKpiTarget] = useState('');
      const [newKpiYear, setNewKpiYear] = useState('2027');

      // 取得資料庫中出現過的所有年度清單
      const availableYears = useMemo(() => {
        const yearsSet = new Set(['2026', '2027', '2028']);
        exhibitions.forEach(e => { if (e.year) yearsSet.add(e.year.toString()); });
        mediaKpis.forEach(k => { if (k.year) yearsSet.add(k.year.toString()); });
        return Array.from(yearsSet).sort();
      }, [exhibitions, mediaKpis]);

      // 動態媒體與展覽名稱清單 (含別名，供輸入時智慧下拉提示)
      const dynamicMediaList = useMemo(() => {
        const mediaSet = new Set(PRESET_MEDIA_LIST);
        exhibitions.forEach(ex => {
          (ex.mediaItems || []).forEach(item => {
            if (item.name && item.name.trim() !== '') mediaSet.add(item.name.trim());
          });
        });
        mediaKpis.forEach(kpi => {
          if (kpi.name && kpi.name.trim() !== '') mediaSet.add(kpi.name.trim());
        });
        return Array.from(mediaSet);
      }, [exhibitions, mediaKpis]);

      // 展覽名稱智慧提示庫 (包含歷史名稱與對照表中的所有標準名與別名)
      const dynamicExhibitionList = useMemo(() => {
        const exSet = new Set(["COMPUTEX", "台北國際電腦展", "北食系列展", "台北國際食品展"]);
        exhibitions.forEach(ex => {
          if (ex.name && ex.name.trim() !== '') exSet.add(ex.name.trim());
        });
        Object.keys(exhibitionAliases).forEach(std => {
          exSet.add(std);
          exhibitionAliases[std].forEach(alias => exSet.add(alias));
        });
        return Array.from(exSet);
      }, [exhibitions, exhibitionAliases]);

      const fetchCloudData = async () => {
        if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('YOUR_SCRIPT_ID_HERE')) {
          setSyncStatus('尚未設定 GAS URL (目前使用單機模式)');
          return;
        }
        setIsLoading(true);
        setSyncStatus('正在同步雲端資料...');
        try {
          const res = await fetch(GAS_WEB_APP_URL);
          const data = await res.json();
          if (Array.isArray(data)) {
            setExhibitions(data.map(e => ({ ...e, year: e.year ? e.year.toString() : '2027' })));
          } else if (data && typeof data === 'object') {
            if (Array.isArray(data.exhibitions)) {
              setExhibitions(data.exhibitions.map(e => ({ ...e, year: e.year ? e.year.toString() : '2027' })));
            }
            if (Array.isArray(data.mediaKpis)) {
              setMediaKpis(data.mediaKpis.map(k => ({ ...k, year: k.year ? k.year.toString() : '2027' })));
            }
            if (data.exhibitionAliases) setExhibitionAliases(data.exhibitionAliases);
            if (data.mediaAliases) setMediaAliases(data.mediaAliases);
          }
          setSyncStatus('雲端資料已是最新狀態');
        } catch (err) {
          console.error('Fetch error:', err);
          setSyncStatus('雲端連線失敗，請檢查網路或 GAS URL 設定');
        } finally {
          setIsLoading(false);
        }
      };

      const saveCloudData = async (newExhibitions, newKpis = mediaKpis, newExAliases = exhibitionAliases, newMedAliases = mediaAliases) => {
        setExhibitions(newExhibitions);
        setMediaKpis(newKpis);
        setExhibitionAliases(newExAliases);
        setMediaAliases(newMedAliases);

        const payload = {
          exhibitions: newExhibitions,
          mediaKpis: newKpis,
          exhibitionAliases: newExAliases,
          mediaAliases: newMedAliases
        };

        if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('YOUR_SCRIPT_ID_HERE')) {
          localStorage.setItem('taitra_media_procurement_data', JSON.stringify(newExhibitions));
          localStorage.setItem('taitra_media_kpi_data', JSON.stringify(newKpis));
          return;
        }

        setIsSaving(true);
        setSyncStatus('正在寫入 Google Sheet 雲端資料庫...');
        try {
          await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          setSyncStatus('雲端共編資料庫同步成功！');
        } catch (err) {
          console.error('Save error:', err);
          setSyncStatus('寫入失敗，請稍後再試');
        } finally {
          setIsSaving(false);
        }
      };

      useEffect(() => {
        fetchCloudData();
      }, []);

      // 依當前選取的年度篩選展覽與 KPI
      const filteredExhibitions = useMemo(() => {
        return exhibitions.filter(ex => (ex.year || '2027') === selectedYear);
      }, [exhibitions, selectedYear]);

      const filteredMediaKpis = useMemo(() => {
        return mediaKpis.filter(kpi => (kpi.year || '2027') === selectedYear);
      }, [mediaKpis, selectedYear]);

      const mediaProcurementPool = useMemo(() => {
        const map = {};
        filteredExhibitions.forEach(ex => {
          (ex.mediaItems || []).forEach(item => {
            const mediaName = item.name ? item.name.trim() : '';
            if (!mediaName) return;

            if (!map[mediaName]) {
              map[mediaName] = {
                mediaName,
                totalExhibitionBudget: 0,
                totalPRRecommended: 0,
                exhibitionsCount: 0,
                participatingExhibitions: []
              };
            }

            const exBudget = Number(item.exBudget) || 0;
            const prBudget = Number(item.prBudget) || 0;

            map[mediaName].totalExhibitionBudget += exBudget;
            map[mediaName].totalPRRecommended += prBudget;
            map[mediaName].exhibitionsCount += 1;
            map[mediaName].participatingExhibitions.push({
              exhibitionId: ex.id,
              exhibitionName: ex.name,
              department: ex.department,
              exBudget,
              prBudget,
              startDate: item.startDate,
              endDate: item.endDate
            });
          });
        });

        return Object.values(map).sort((a, b) => b.totalPRRecommended - a.totalPRRecommended);
      }, [filteredExhibitions]);

      const selectedMediaGroupList = useMemo(() => {
        return mediaProcurementPool.filter(m => selectedMediaNames.includes(m.mediaName));
      }, [mediaProcurementPool, selectedMediaNames]);

      const calculatedMediaKpis = useMemo(() => {
        return filteredMediaKpis.map(kpi => {
          const found = mediaProcurementPool.find(m => m.mediaName.toLowerCase() === kpi.name.toLowerCase());
          const allocatedAmount = found ? found.totalPRRecommended : 0;
          const target = Number(kpi.targetKpi) || 0;
          const percentage = target > 0 ? Math.round((allocatedAmount / target) * 100) : 0;

          return { ...kpi, allocatedAmount, percentage };
        });
      }, [filteredMediaKpis, mediaProcurementPool]);

      // 拖拉排序事件處理 (針對當年度列表)
      const handleDragStart = (e, index) => {
        setDraggedIndex(index);
        e.dataTransfer.effectAllowed = 'move';
      };
      const handleDragOver = (e, index) => {
        e.preventDefault();
        if (dragOverIndex !== index) setDragOverIndex(index);
      };
      const handleDrop = (e, dropIndex) => {
        e.preventDefault();
        if (draggedIndex === null || draggedIndex === dropIndex) {
          setDraggedIndex(null); setDragOverIndex(null); return;
        }
        // 在當前年度子陣列中調換順序，再合併回完整 exhibitions
        const currentYearList = [...filteredExhibitions];
        const [movedItem] = currentYearList.splice(draggedIndex, 1);
        currentYearList.splice(dropIndex, 0, movedItem);

        const otherYearsList = exhibitions.filter(ex => (ex.year || '2027') !== selectedYear);
        const updatedList = [...otherYearsList, ...currentYearList];

        setDraggedIndex(null); setDragOverIndex(null);
        saveCloudData(updatedList, mediaKpis);
      };
      const handleDragEnd = () => { setDraggedIndex(null); setDragOverIndex(null); };

      const handleToggleExhibitionExpand = (exId) => {
        setExpandedExhibitions(prev => prev.includes(exId) ? prev.filter(id => id !== exId) : [...prev, exId]);
      };
      const handleToggleTimeline = (mediaName) => {
        setExpandedTimelineMedia(prev => prev.includes(mediaName) ? prev.filter(name => name !== mediaName) : [...prev, mediaName]);
      };

      const handleToggleMediaSelect = (mediaName) => {
        setSelectedMediaNames(prev => prev.includes(mediaName) ? prev.filter(name => name !== mediaName) : [...prev, mediaName]);
      };
      const handleSelectAllMedia = () => setSelectedMediaNames(mediaProcurementPool.map(m => m.mediaName));
      const handleClearAllMedia = () => setSelectedMediaNames([]);

      const handleAddMediaKpi = (e) => {
        e.preventDefault();
        if (!newKpiName.trim()) return;
        const newItem = {
          id: 'KPI-' + Date.now(),
          name: newKpiName.trim(),
          targetKpi: Number(newKpiTarget) || 0,
          year: newKpiYear
        };
        saveCloudData(exhibitions, [...mediaKpis, newItem]);
        setNewKpiName(''); setNewKpiTarget('');
      };

      const handleDeleteMediaKpi = (id) => {
        if (confirm('確定要刪除此媒體 KPI 追蹤嗎？')) {
          saveCloudData(exhibitions, mediaKpis.filter(k => k.id !== id));
        }
      };

      const handleOpenKpiModal = (kpi) => {
        setEditingKpi(kpi);
        setKpiForm({ name: kpi.name, targetKpi: kpi.targetKpi, year: kpi.year || '2027' });
        setIsKpiModalOpen(true);
      };

      const handleSaveKpiEdit = (e) => {
        e.preventDefault();
        if (!kpiForm.name.trim()) return;
        const updatedKpis = mediaKpis.map(k => k.id === editingKpi.id ? { ...k, name: kpiForm.name.trim(), targetKpi: Number(kpiForm.targetKpi) || 0, year: kpiForm.year } : k);
        saveCloudData(exhibitions, updatedKpis);
        setIsKpiModalOpen(false);
      };

      // 📋 一鍵複製去年展覽資料
      const handleCopyFromPreviousYear = (sourceExId) => {
        const sourceEx = exhibitions.find(e => e.id === sourceExId);
        if (!sourceEx) return;
        setFormData({
          name: sourceEx.name,
          department: sourceEx.department,
          totalBudget: sourceEx.totalBudget,
          year: selectedYear, // 帶入當前選取的年度
          notes: sourceEx.notes || '',
          mediaItems: (sourceEx.mediaItems || []).map(item => ({
            ...item,
            id: Date.now().toString() + Math.random(),
            startDate: '', endDate: '' // 走期清空讓同仁重新填寫
          }))
        });
      };

      const handleOpenModal = (ex = null) => {
        if (ex) {
          setEditingExhibition(ex);
          setFormData({
            name: ex.name || '',
            department: ex.department || '',
            totalBudget: ex.totalBudget || '',
            year: ex.year || selectedYear,
            notes: ex.notes || '',
            mediaItems: ex.mediaItems ? JSON.parse(JSON.stringify(ex.mediaItems)) : []
          });
        } else {
          setEditingExhibition(null);
          setFormData({
            name: '',
            department: '',
            totalBudget: '',
            year: selectedYear,
            notes: '',
            mediaItems: [
              { id: Date.now().toString(), name: '工商時報', exBudget: '', prBudget: '', startDate: '', endDate: '' }
            ]
          });
        }
        setIsModalOpen(true);
      };

      const handleAddMediaRow = () => {
        setFormData(prev => ({
          ...prev,
          mediaItems: [...prev.mediaItems, { id: Date.now().toString(), name: '', exBudget: '', prBudget: '', startDate: '', endDate: '' }]
        }));
      };

      const handleRemoveMediaRow = (id) => {
        setFormData(prev => ({ ...prev, mediaItems: prev.mediaItems.filter(item => item.id !== id) }));
      };

      const handleMediaChange = (id, field, value) => {
        setFormData(prev => ({
          ...prev,
          mediaItems: prev.mediaItems.map(item => {
            if (item.id === id) {
              const updated = { ...item, [field]: value };
              if (field === 'exBudget' && (item.prBudget === '' || item.prBudget === item.exBudget)) {
                updated.prBudget = value;
              }
              return updated;
            }
            return item;
          })
        }));
      };

      const handleSaveExhibition = (e) => {
        e.preventDefault();
        if (!formData.name) { alert('請輸入活動名稱'); return; }

        const newExhibition = {
          id: editingExhibition ? editingExhibition.id : 'EX-' + Date.now(),
          name: formData.name.trim(),
          department: formData.department || '未指定',
          totalBudget: Number(formData.totalBudget) || 0,
          year: formData.year || selectedYear,
          notes: formData.notes || '',
          mediaItems: formData.mediaItems.map(item => ({
            ...item,
            name: item.name ? item.name.trim() : '',
            exBudget: Number(item.exBudget) || 0,
            prBudget: Number(item.prBudget) || 0
          }))
        };

        let updatedList = [];
        if (editingExhibition) {
          updatedList = exhibitions.map(ex => ex.id === editingExhibition.id ? newExhibition : ex);
        } else {
          updatedList = [...exhibitions, newExhibition];
        }

        saveCloudData(updatedList, mediaKpis);
        setIsModalOpen(false);
      };

      const handleDeleteExhibition = (id) => {
        if (confirm('確定要刪除此活動規劃嗎？')) {
          saveCloudData(exhibitions.filter(ex => ex.id !== id), mediaKpis);
        }
      };

      const overallStats = useMemo(() => {
        let grandExBudget = 0;
        let grandPRBudget = 0;
        let grandTotalBudgetLimit = 0;
        filteredExhibitions.forEach(ex => {
          grandTotalBudgetLimit += Number(ex.totalBudget) || 0;
          (ex.mediaItems || []).forEach(item => {
            grandExBudget += Number(item.exBudget) || 0;
            grandPRBudget += Number(item.prBudget) || 0;
          });
        });
        return { grandExBudget, grandPRBudget, grandTotalBudgetLimit };
      }, [filteredExhibitions]);

      const calculateTimelinePosition = (startStr, endStr, targetYear = selectedYear) => {
        if (!startStr || !endStr) return { left: '0%', width: '100%', isPlaceholder: true };
        const start = new Date(startStr);
        const end = new Date(endStr);
        const minDate = new Date(`${targetYear}-01-01`);
        const maxDate = new Date(`${targetYear}-12-31`);
        const totalSpan = maxDate - minDate;
        
        let leftPercent = ((start - minDate) / totalSpan) * 100;
        let widthPercent = ((end - start) / totalSpan) * 100;

        if (leftPercent < 0) leftPercent = 0;
        if (leftPercent > 100) leftPercent = 100;
        if (widthPercent < 2) widthPercent = 2;
        if (leftPercent + widthPercent > 100) widthPercent = 100 - leftPercent;

        return { left: `${leftPercent}%`, width: `${widthPercent}%`, isPlaceholder: false };
      };

      // 智慧歸戶輔助函式：將使用者輸入的名稱對應回標準系列名稱
      const getNormalizedSeriesName = (rawName) => {
        if (!rawName) return '未命名展覽';
        const nameClean = rawName.trim();
        // 檢查是否有在 exhibitionAliases 中被歸密
        for (const stdName in exhibitionAliases) {
          if (stdName.toLowerCase() === nameClean.toLowerCase()) return stdName;
          const aliases = exhibitionAliases[stdName] || [];
          if (aliases.some(a => a.toLowerCase() === nameClean.toLowerCase())) return stdName;
        }
        // 若無對照，智慧過濾掉年度數字後作為預設歸戶組
        return nameClean.replace(/202[5-8]/g, '').trim();
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-slate-900 text-white shadow-md border-b border-slate-800 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap justify-between items-center gap-4">
              <div className="flex items-center space-x-3">
                <div className="bg-blue-600 p-2 rounded-lg text-white font-bold text-xl tracking-wider shadow">
                  TAITRA
                </div>
                <div>
                  <h1 className="text-lg font-bold leading-tight">外貿協會公關組</h1>
                  <div className="flex items-center space-x-2 text-xs text-slate-400">
                    <span>媒體採購與預算整合管理系統</span>
                    <span className="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-1.5 py-0.5 rounded text-[10px]">
                      ☁️ Google Sheet 跨年共編中
                    </span>
                  </div>
                </div>
              </div>

              {/* 💡 全域年度切換器 */}
              <div className="flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                <span className="text-xs text-slate-300 font-semibold">📅 檢視年度：</span>
                <select
                  value={selectedYear}
                  onChange={(e) => setSelectedYear(e.target.value)}
                  className="bg-slate-900 text-white text-xs font-bold px-2.5 py-1 rounded border border-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                  {availableYears.map(yr => (
                    <option key={yr} value={yr}>{yr 年度</option>
                  ))}
                </select>
              </div>

              {/* Tabs */}
              <nav className="flex bg-slate-800 p-1 rounded-lg border border-slate-700">
                <button
                  onClick={() => setActiveTab('exhibitions')}
                  className={`px-3.5 py-1.5 rounded-md text-xs font-medium transition-all ${
                    activeTab === 'exhibitions' ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:text-white hover:bg-slate-700/50'
                  }`}
                >
                  依活動 (預算分配)
                </button>
                <button
                  onClick={() => setActiveTab('media')}
                  className={`px-3.5 py-1.5 rounded-md text-xs font-medium transition-all ${
                    activeTab === 'media' ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:text-white hover:bg-slate-700/50'
                  }`}
                >
                  依媒體 (採購參考)
                </button>
                <button
                  onClick={() => setActiveTab('comparison')}
                  className={`px-3.5 py-1.5 rounded-md text-xs font-medium transition-all ${
                    activeTab === 'comparison' ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:text-white hover:bg-slate-700/50'
                  }`}
                >
                  📈 跨年度比較
                </button>
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`px-3.5 py-1.5 rounded-md text-xs font-medium transition-all ${
                    activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:text-white hover:bg-slate-700/50'
                  }`}
                >
                  總體數據儀表板
                </button>
              </nav>

              {/* Actions & Status */}
              <div className="flex items-center space-x-2">
                <button
                  onClick={() => fetchCloudData()}
                  title="重新從 Google Sheet 抓取最新共編資料"
                  className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-medium flex items-center space-x-1"
                >
                  <span>🔄</span>
                  <span>{isLoading ? '同步中...' : '重新整理'}</span>
                </button>

                <button
                  onClick={() => handleOpenModal()}
                  className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium flex items-center shadow transition-all"
                >
                  <span className="mr-1 text-base font-bold">+</span> 新增活動
                </button>
              </div>
            </div>

            <div className="bg-slate-800/80 px-4 py-1 text-[11px] text-slate-300 flex justify-between items-center border-t border-slate-800">

                      <div>
                        <h3 className="font-bold text-slate-800 text-base flex items-center">
                          <span className="mr-2">📈</span> 各展覽歷年預算與公關分配金額比較 (YoY 跨年並排)
                        </h3>
                        <p className="text-xs text-slate-500 mt-0.5">
                          系統會自動根據展覽名稱歸戶，將不同年度的同系列展覽（如 COMPUTEX、北食系列展）並排對照，未設定別名的獨立展覽也會一併列出。
                        </p>
                      </div>

                      {(() => {
                        // 智慧將所有展覽按歸戶名稱分群
                        const seriesMap = {};
                        exhibitions.forEach(ex => {
                          const seriesName = getNormalizedSeriesName(ex.name);
                          if (!seriesMap[seriesName]) {
                            seriesMap[seriesName] = { seriesName, yearsData: {} };
                          }
                          const yr = ex.year || '2027';
                          if (!seriesMap[seriesName].yearsData[yr]) {
                            seriesMap[seriesName].yearsData[yr] = { totalLimit: 0, totalPR: 0, count: 0, names: [] };
                          }
                          seriesMap[seriesName].yearsData[yr].totalLimit += Number(ex.totalBudget) || 0;
                          const prSum = (ex.mediaItems || []).reduce((s, i) => s + (Number(i.prBudget) || 0), 0);
                          seriesMap[seriesName].yearsData[yr].totalPR += prSum;
                          seriesMap[seriesName].yearsData[yr].count += 1;
                          seriesMap[seriesName].yearsData[yr].names.push(ex.name);
                        });

                        const sortedSeries = Object.values(seriesMap);
                        const yearsArray = availableYears;

                        return (
                          <div className="overflow-x-auto pt-2">
                            <table className="w-full text-sm text-left text-slate-600 border border-slate-200 rounded-lg">
                              <thead className="text-xs text-slate-700 uppercase bg-slate-100 border-b">
                                <tr>
                                  <th className="px-4 py-3 border-r">展覽系列名稱</th>
                                  {yearsArray.map(yr => (
                                    <th key={yr} className="px-4 py-3 text-right border-r bg-blue-50/50">
                                      {yr} 年度 (上限 / 公關建議)
                                    </th>
                                  ))}
                                </tr>
                              </thead>
                              <tbody className="divide-y">
                                {sortedSeries.map(series => (
                                  <tr key={series.seriesName} className="hover:bg-slate-50">
                                    <td className="px-4 py-3 font-bold text-slate-800 border-r bg-slate-50/50">
                                      {series.seriesName}
                                      <div className="text-[10px] font-normal text-slate-400">包含子活動：{Array.from(new Set(series.yearsData[yearsArray[0]]?.names || [])).join(', ')}</div>
                                    </td>
                                    {yearsArray.map(yr => {
                                      const data = series.yearsData[yr];
                                      return (
                                        <td key={yr} className="px-4 py-3 text-right border-r">
                                          {data ? (
                                            <div>
                                              <div className="text-slate-500 text-xs">NT$ {data.totalLimit.toLocaleString()}</div>
                                              <div className="font-bold text-blue-600">NT$ {data.totalPR.toLocaleString()}</div>
                                            </div>
                                          ) : (
                                            <span className="text-slate-300 text-xs">— 無資料 —</span>
                                          )}
                                        </td>
                                      );
                                    })}
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        );
                      })()}
                    </div>
                  </div>
                )}

                {/* 4. 總體數據儀表板 */}
                {activeTab === 'dashboard' && (
                  <div className="space-y-6">
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                      <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <span className="text-xs font-semibold text-slate-500">{selectedYear} 登錄展覽總數</span>
                        <div className="text-2xl font-bold text-slate-800 mt-1">{filteredExhibitions.length} 個展覽</div>
                      </div>
                      <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <span className="text-xs font-semibold text-slate-500">涵蓋媒體總數</span>
                        <div className="text-2xl font-bold text-slate-800 mt-1">{mediaProcurementPool.length} 家媒體</div>
                      </div>
                      <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <span className="text-xs font-semibold text-slate-500">預算總額上限合記</span>
                        <div className="text-2xl font-bold text-indigo-600 mt-1">NT$ {overallStats.grandTotalBudgetLimit.toLocaleString()}</div>
                      </div>
                      <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <span className="text-xs font-semibold text-slate-500">展覽處需求加總</span>
                        <div className="text-2xl font-bold text-blue-600 mt-1">NT$ {overallStats.grandExBudget.toLocaleString()}</div>
                      </div>
                      <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <span className="text-xs font-semibold text-slate-500">公關組建議加總</span>
                        <div className="text-2xl font-bold text-emerald-600 mt-1">NT$ {overallStats.grandPRBudget.toLocaleString()}</div>
                      </div>
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
                      <h3 className="font-bold text-slate-800 text-base flex items-center">
                        <span className="mr-2">📊</span> {selectedYear} 全館各展覽媒體廣告投放走期甘特圖
                      </h3>
                      <div className="border border-slate-200 rounded-lg p-4 bg-slate-50/50 space-y-3">
                        <div className="flex justify-between text-[11px] text-slate-400 border-b pb-2 font-mono">
                          <span>01月</span><span>03月</span><span>05月</span><span>07月</span><span>09月</span><span>11月</span><span>12月</span>
                        </div>
                        <div className="space-y-4">
                          {filteredExhibitions.map(ex => (
                            <div key={ex.id} className="space-y-1.5 border-b pb-3">
                              <div className="flex justify-between text-xs font-bold text-slate-800"><span>{ex.name} ({ex.department})</span></div>
                              <div className="space-y-1.5">
                                {(ex.mediaItems || []).map((item, idx) => {
                                  const pos = calculateTimelinePosition(item.startDate, item.endDate, selectedYear);
                                  return (
                                    <div key={idx} className="relative h-7 bg-slate-200/60 rounded flex items-center px-2">
                                      <span className="text-[11px] font-semibold text-slate-700 z-10 truncate w-1/3">{item.name}</span>
                                      <div className="absolute inset-y-1 right-2 left-1/3 bg-slate-100 rounded overflow-hidden">
                                        {!pos.isPlaceholder ? (
                                          <div className="absolute h-full bg-blue-600/85 rounded" style={{ left: pos.left, width: pos.width }}></div>
                                        ) : (
                                          <div className="w-full h-full flex items-center justify-center text-[10px] text-slate-400">未設定走期</div>
                                        )}
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </>
            )}
          </main>

          {/* 編輯 KPI 彈跳視窗 */}
          {isKpiModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-xl max-w-md w-full overflow-hidden">
                <div className="p-5 bg-slate-50 border-b flex justify-between items-center">
                  <h3 className="font-bold text-slate-800 text-base">✏️ 編輯媒體 KPI 追蹤</h3>
                  <button onClick={() => setIsKpiModalOpen(false)} className="text-slate-400 font-bold text-xl px-2">✕</button>
                </div>
                <form onSubmit={handleSaveKpiEdit} className="p-6 space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">媒體名稱 *</label>
                    <input type="text" list="media-presets" required value={kpiForm.name} onChange={(e) => setKpiForm({ ...kpiForm, name: e.target.value })} className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">年度 KPI 需求金額 (NT$) *</label>
                    <input type="number" required value={kpiForm.targetKpi} onChange={(e) => setKpiForm({ ...kpiForm, targetKpi: e.target.value })} className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">所屬年度 *</label>
                    <select value={kpiForm.year} onChange={(e) => setKpiForm({ ...kpiForm, year: e.target.value })} className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg">
                      {availableYears.map(yr => <option key={yr} value={yr}>{yr}</option>)}
                    </select>
                  </div>
                  <div className="pt-2 flex justify-end space-x-2">
                    <button type="button" onClick={() => setIsKpiModalOpen(false)} className="px-4 py-2 text-xs text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
                    <button type="submit" className="px-4 py-2 text-xs bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow">儲存變更</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 新增 / 編輯展覽 Modal (含「一鍵複製去年展覽」與「智慧下拉提示」) */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl shadow-xl max-w-3xl w-full max-h-[90vh] flex flex-col overflow-hidden">
                <div className="p-5 bg-slate-50 border-b flex justify-between items-center">
                  <h3 className="font-bold text-slate-800 text-lg">
                    {editingExhibition ? '✏️ 編輯活動媒體需求' : '➕ 新增活動媒體需求'}
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 font-bold text-xl px-2">✕</button>
                </div>

                <form onSubmit={handleSaveExhibition} className="p-6 overflow-y-auto space-y-6 flex-1">
                  {/* 📋 一鍵複製去年展覽快速帶入功能 */}
                  {!editingExhibition && exhibitions.length > 0 && (
                    <div className="p-3 bg-blue-50/80 rounded-xl border border-blue-200 text-xs flex flex-wrap items-center justify-between gap-2">
                      <span className="font-bold text-blue-900">💡 快速帶入：</span>
                      <select 
                        onChange={(e) => { if (e.target.value) handleCopyFromPreviousYear(e.target.value); }}
                        defaultValue=""
                        className="text-xs p-1.5 bg-white border border-blue-300 rounded text-blue-800 font-medium"
                      >
                        <option value="" disabled>-- 選擇歷史展覽快速複製設定 --</option>
                        {exhibitions.map(ex => (
                          <option key={ex.id} value={ex.id}>
                            [{ex.year || '2027'}] {ex.name} ({ex.department})
                          </option>
                        ))}
                      </select>
                    </div>
                  )}

                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
                    <div className="sm:col-span-2">
                      <label className="block text-xs font-semibold text-slate-700 mb-1">活動名稱 (可直接手動輸入或從提示選擇) *</label>
                      <input
                        type="text"
                        list="exhibition-presets"
                        required
                        placeholder="例如：COMPUTEX 2027 或 台北國際電腦展"
                        value={formData.name}
                        onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                        className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg focus:ring-blue-500"
                      />
                    </div>

                    <div className="sm:col-span-1">
                      <label className="block text-xs font-semibold text-slate-700 mb-1">承辦單位 *</label>
                      <input
                        type="text"
                        placeholder="例如：展覽處展一組"
                        value={formData.department}
                        onChange={(e) => setFormData({ ...formData, department: e.target.value })}
                        className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg focus:ring-blue-500"
                      />
                    </div>

                    <div className="sm:col-span-1">
                      <label className="block text-xs font-semibold text-slate-700 mb-1">所屬年度 *</label>
                      <select
                        value={formData.year}
                        onChange={(e) => setFormData({ ...formData, year: e.target.value })}
                        className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg focus:ring-blue-500 font-bold text-blue-700"
                      >
                        {availableYears.map(yr => <option key={yr} value={yr}>{yr 年度</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">展覽處規劃預算總額上限 (NT$)</label>
                      <input
                        type="number"
                        placeholder="1000000"
                        value={formData.totalBudget}
                        onChange={(e) => setFormData({ ...formData, totalBudget: e.target.value })}
                        className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg focus:ring-blue-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">備註說明 / 宣傳重點</label>
                      <input
                        type="text"
                        placeholder="主打海外買主..."
                        value={formData.notes}
                        onChange={(e) => setFormData({ ...formData, notes: e.target.value })}
                        className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg focus:ring-blue-500"
                      />
                    </div>
                  </div>

                  <div className="space-y-3 pt-2 border-t">
                    <div className="flex justify-between items-center">
                      <label className="text-sm font-bold text-slate-800">欲投放媒體與走期規劃</label>
                      <button type="button" onClick={handleAddMediaRow} className="text-xs bg-blue-50 hover:bg-blue-100 text-blue-600 border px-2.5 py-1 rounded font-medium">
                        + 新增一筆媒體
                      </button>
                    </div>

                    <div className="space-y-3">
                      {formData.mediaItems.map((item, idx) => (
                        <div key={item.id} className="p-3 bg-slate-50 rounded-xl border space-y-2">
                          <div className="flex justify-between items-center text-xs text-slate-500">
                            <span>媒體項目 #{idx + 1}</span>
                            {formData.mediaItems.length > 1 && (
                              <button type="button" onClick={() => handleRemoveMediaRow(item.id)} className="text-rose-600 font-semibold">✕ 移除</button>
                            )}
                          </div>
                          <div className="grid grid-cols-1 sm:grid-cols-4 gap-2">
                            <div>
                              <label className="block text-[11px] text-slate-500 mb-0.5">媒體名稱</label>
                              <input
                                type="text"
                                list="media-presets"
                                placeholder="選擇或輸入媒體"
                                value={item.name}
                                onChange={(e) => handleMediaChange(item.id, 'name', e.target.value)}
                                className="w-full text-xs p-2 bg-white border rounded"
                              />
                            </div>
                            <div>
                              <label className="block text-[11px] text-slate-500 mb-0.5">展覽處預算 (NT$)</label>
                              <input type="number" placeholder="0" value={item.exBudget} onChange={(e) => handleMediaChange(item.id, 'exBudget', e.target.value)} className="w-full text-xs p-2 bg-white border rounded" />
                            </div>
                            <div>
                              <label className="block text-[11px] text-slate-500 mb-0.5">公關組建議金額 (NT$)</label>
                              <input type="number" placeholder="0" value={item.prBudget} onChange={(e) => handleMediaChange(item.id, 'prBudget', e.target.value)} className="w-full text-xs p-2 bg-white border rounded text-blue-600 font-semibold" />
                            </div>
                            <div>
                              <label className="block text-[11px] text-slate-500 mb-0.5">預定走期</label>
                              <div className="flex items-center space-x-1">
                                <input type="date" value={item.startDate} onChange={(e) => handleMediaChange(item.id, 'startDate', e.target.value)} className="w-1/2 text-[10px] p-1.5 bg-white border rounded" />
                                <span className="text-slate-400">~</span>
                                <input type="date" value={item.endDate} onChange={(e) => handleMediaChange(item.id, 'endDate', e.target.value)} className="w-1/2 text-[10px] p-1.5 bg-white border rounded" />
                              </div>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* 💡 智慧提示 DataList (支援展覽名稱與媒體名稱提示) */}
                  <datalist id="exhibition-presets">
                    {dynamicExhibitionList.map(name => <option key={name} value={name} />)}
                  </datalist>
                  <datalist id="media-presets">
                    {dynamicMediaList.map(m => <option key={m} value={m} />)}
                  </datalist>

                  <div className="pt-4 border-t flex justify-end space-x-3">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
                    <button type="submit" className="px-5 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow">儲存並同步至雲端</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <footer className="bg-slate-900 text-slate-400 py-4 border-t border-slate-800 text-center text-xs">
            外貿協會公關組 跨年度媒體採購整合系統 &copy; {new Date().getFullYear()} Taiwan External Trade Development Council
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
