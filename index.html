<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外貿協會公關組 - 媒體採購與預算整合管理系統 (GAS 雲端共編版)</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; }
  </style>
  <!-- 網站書籤圖示 -->
  <link rel="icon" type="image/png" href="./favicon.png">
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ⚠️ 請保留您原本正常運作的 GAS 網址
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzFYzNAij9SbKi83N3lQS5k__dVulfSzjZtoVeqFy7c1P-Gf-7U0F8KecSiw6FDGNtV/exec";

    const PRESET_MEDIA_LIST = [
      "工商時報", "經濟日報", "商業周刊", 
      "自由時報", "聯合報", "中國時報"
    ];

    const PRESET_YEARS = ["2026", "2027", "2028", "2029"];

    function App() {
      const [exhibitions, setExhibitions] = useState([]);
      const [mediaKpis, setMediaKpis] = useState([]);

      // 💡 媒體年度 KPI 區塊收合狀態與檢視年份
      const [isKpiSectionExpanded, setIsKpiSectionExpanded] = useState(false);
      const [kpiSelectedYear, setKpiSelectedYear] = useState('2027');

      // 💡 「資料匯入」中「各活動預算分配」檢視年份
      const [exhibitionSelectedYear, setExhibitionSelectedYear] = useState('2027');

      // 💡 「依媒體」分頁檢視年份
      const [mediaSelectedYear, setMediaSelectedYear] = useState('2027');

      // 💡 「總體數據儀表板」檢視年份 ('ALL' 或特定年份)
      const [dashboardSelectedYear, setDashboardSelectedYear] = useState('2027');

      // 💡 「跨年度比較」分頁選取的單一特定活動名稱
      const [compareActivityKey, setCompareActivityKey] = useState('');

      // 💡 媒體甘特圖展開狀態
      const [expandedTimelineMedia, setExpandedTimelineMedia] = useState([]);
      
      // 💡 各活動卡片展開狀態 (預設空陣列 = 全部收合)
      const [expandedExhibitions, setExpandedExhibitions] = useState([]);

      // 💡 活動拖曳排序狀態
      const [draggedIndex, setDraggedIndex] = useState(null);
      const [dragOverIndex, setDragOverIndex] = useState(null);

      // 💡 KPI 卡片拖曳排序狀態
      const [draggedKpiId, setDraggedKpiId] = useState(null);
      const [dragOverKpiId, setDragOverKpiId] = useState(null);

      const handleToggleExhibitionExpand = (exId) => {
        setExpandedExhibitions(prev => 
          prev.includes(exId) ? prev.filter(id => id !== exId) : [...prev, exId]
        );
      };

      // 活動拖拉排序處理
      const handleDragStart = (e, index) => {
        setDraggedIndex(index);
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', index.toString());
      };

      const handleDragOver = (e, index) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (dragOverIndex !== index) {
          setDragOverIndex(index);
        }
      };

      const handleDrop = (e, dropIndex) => {
        e.preventDefault();
        if (draggedIndex === null || draggedIndex === dropIndex) {
          setDraggedIndex(null);
          setDragOverIndex(null);
          return;
        }

        const updatedList = [...exhibitions];
        const [movedItem] = updatedList.splice(draggedIndex, 1);
        updatedList.splice(dropIndex, 0, movedItem);

        setDraggedIndex(null);
        setDragOverIndex(null);

        saveCloudData(updatedList, mediaKpis);
      };

      const handleDragEnd = () => {
        setDraggedIndex(null);
        setDragOverIndex(null);
      };

      // KPI 卡片拖拉排序處理
      const handleKpiDragStart = (e, kpiId) => {
        setDraggedKpiId(kpiId);
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', kpiId);
      };

      const handleKpiDragOver = (e, kpiId) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (dragOverKpiId !== kpiId) {
          setDragOverKpiId(kpiId);
        }
      };

      const handleKpiDrop = (e, targetKpiId) => {
        e.preventDefault();
        if (!draggedKpiId || draggedKpiId === targetKpiId) {
          setDraggedKpiId(null);
          setDragOverKpiId(null);
          return;
        }

        const fromIndex = mediaKpis.findIndex(k => k.id === draggedKpiId);
        const toIndex = mediaKpis.findIndex(k => k.id === targetKpiId);

        if (fromIndex === -1 || toIndex === -1) {
          setDraggedKpiId(null);
          setDragOverKpiId(null);
          return;
        }

        const updatedKpis = [...mediaKpis];
        const [movedKpi] = updatedKpis.splice(fromIndex, 1);
        updatedKpis.splice(toIndex, 0, movedKpi);

        setDraggedKpiId(null);
        setDragOverKpiId(null);

        saveCloudData(exhibitions, updatedKpis);
      };

      const handleKpiDragEnd = () => {
        setDraggedKpiId(null);
        setDragOverKpiId(null);
      };

      const handleToggleTimeline = (mediaName) => {
        setExpandedTimelineMedia(prev => 
          prev.includes(mediaName) ? prev.filter(name => name !== mediaName) : [...prev, mediaName]
        );
      };

      const [activeTab, setActiveTab] = useState('exhibitions'); 

      // 💡 依媒體視角多選狀態：預設全取消 (空陣列)
      const [selectedMediaNames, setSelectedMediaNames] = useState([]);

      const [isLoading, setIsLoading] = useState(false);
      const [isSaving, setIsSaving] = useState(false);
      const [syncStatus, setSyncStatus] = useState('已連線至雲端資料庫');

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingExhibition, setEditingExhibition] = useState(null);

      // 💡 新增 / 編輯 KPI 彈跳視窗狀態
      const [isKpiModalOpen, setIsKpiModalOpen] = useState(false);
      const [editingKpi, setEditingKpi] = useState(null);
      const [kpiForm, setKpiForm] = useState({ year: '2027', name: '', targetKpi: '' });

      const [formData, setFormData] = useState({
        name: '',
        department: '',
        totalBudget: '',
        year: '2027',
        notes: '',
        mediaItems: []
      });

      // 動態媒體清單
      const dynamicMediaList = useMemo(() => {
        const mediaSet = new Set(PRESET_MEDIA_LIST);
        exhibitions.forEach(ex => {
          (ex.mediaItems || []).forEach(item => {
            if (item.name && item.name.trim() !== '') {
              mediaSet.add(item.name.trim());
            }
          });
        });
        mediaKpis.forEach(kpi => {
          if (kpi.name && kpi.name.trim() !== '') {
            mediaSet.add(kpi.name.trim());
          }
        });
        return Array.from(mediaSet);
      }, [exhibitions, mediaKpis]);

      // 取得所有出現過的年份清單 (由小到大排序：年份越小的越前面)
      const availableYears = useMemo(() => {
        const yearsSet = new Set();
        exhibitions.forEach(ex => {
          yearsSet.add(String(ex.year || '2027').trim());
        });
        mediaKpis.forEach(kpi => {
          yearsSet.add(String(kpi.year || '2027').trim());
        });
        if (yearsSet.size === 0) {
          yearsSet.add('2027');
        }
        return Array.from(yearsSet).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
      }, [exhibitions, mediaKpis]);

      // 確保預設選取年份在可用清單內
      useEffect(() => {
        if (availableYears.length > 0) {
          if (!availableYears.includes(kpiSelectedYear)) {
            setKpiSelectedYear(availableYears[0]);
          }
          if (!availableYears.includes(exhibitionSelectedYear)) {
            setExhibitionSelectedYear(availableYears[0]);
          }
          if (!availableYears.includes(mediaSelectedYear)) {
            setMediaSelectedYear(availableYears[0]);
          }
          if (dashboardSelectedYear !== 'ALL' && !availableYears.includes(dashboardSelectedYear)) {
            setDashboardSelectedYear(availableYears[0]);
          }
        }
      }, [availableYears]);

      const fetchCloudData = async () => {
        if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('YOUR_SCRIPT_ID_HERE')) {
          setSyncStatus('尚未設定 GAS URL (目前使用單機模式)');
          return;
        }
        setIsLoading(true);
        setSyncStatus('正在同步雲端資料...');
        try {
          const res = await fetch(GAS_WEB_APP_URL);
          const data = await res.json();
          if (Array.isArray(data)) {
            setExhibitions(data);
          } else if (data && typeof data === 'object') {
            if (Array.isArray(data.exhibitions)) {
              setExhibitions(data.exhibitions);
            }
            if (Array.isArray(data.mediaKpis)) {
              setMediaKpis(data.mediaKpis);
            }
          }
          setSyncStatus('雲端資料已是最新狀態');
        } catch (err) {
          console.error('Fetch error:', err);
          setSyncStatus('雲端連線失敗，請檢查網路或 GAS URL 設定');
        } finally {
          setIsLoading(false);
        }
      };

      const saveCloudData = async (newExhibitions, newKpis = mediaKpis) => {
        setExhibitions(newExhibitions);
        setMediaKpis(newKpis);

        const payload = {
          exhibitions: newExhibitions,
          mediaKpis: newKpis
        };

        if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('YOUR_SCRIPT_ID_HERE')) {
          localStorage.setItem('taitra_media_procurement_data', JSON.stringify(newExhibitions));
          localStorage.setItem('taitra_media_kpi_data', JSON.stringify(newKpis));
          return;
        }

        setIsSaving(true);
        setSyncStatus('正在寫入 Google Sheet 雲端資料庫...');
        try {
          await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          setSyncStatus('雲端共編資料庫同步成功！');
        } catch (err) {
          console.error('Save error:', err);
          setSyncStatus('寫入失敗，請稍後再試');
        } finally {
          setIsSaving(false);
        }
      };

      useEffect(() => {
        fetchCloudData();
      }, []);

      // 「資料匯入」分頁當前檢視年份的展覽清單
      const filteredYearExhibitions = useMemo(() => {
        return exhibitions.filter(ex => String(ex.year || '2027').trim() === String(exhibitionSelectedYear).trim());
      }, [exhibitions, exhibitionSelectedYear]);

      // 全年度媒體採購池 (供 CSV 匯出使用)
      const mediaProcurementPool = useMemo(() => {
        const map = {};
        exhibitions.forEach(ex => {
          (ex.mediaItems || []).forEach(item => {
            const mediaName = item.name ? item.name.trim() : '';
            if (!mediaName) return;

            if (!map[mediaName]) {
              map[mediaName] = {
                mediaName,
                totalExhibitionBudget: 0,
                totalPRRecommended: 0,
                exhibitionsCount: 0,
                participatingExhibitions: []
              };
            }

            const exBudget = Number(item.exBudget) || 0;
            const prBudget = Number(item.prBudget) || 0;

            map[mediaName].totalExhibitionBudget += exBudget;
            map[mediaName].totalPRRecommended += prBudget;
            map[mediaName].exhibitionsCount += 1;
            map[mediaName].participatingExhibitions.push({
              exhibitionId: ex.id,
              exhibitionName: ex.name,
              department: ex.department,
              year: String(ex.year || '2027').trim(),
              exBudget,
              prBudget,
              startDate: item.startDate,
              endDate: item.endDate
            });
          });
        });

        return Object.values(map).sort((a, b) => b.totalPRRecommended - a.totalPRRecommended);
      }, [exhibitions]);

      // 依選定年度過濾後的媒體採購池 (供「依媒體」分頁使用)
      const yearlyMediaProcurementPool = useMemo(() => {
        const map = {};
        exhibitions
          .filter(ex => String(ex.year || '2027').trim() === mediaSelectedYear)
          .forEach(ex => {
            (ex.mediaItems || []).forEach(item => {
              const mediaName = item.name ? item.name.trim() : '';
              if (!mediaName) return;

              if (!map[mediaName]) {
                map[mediaName] = {
                  mediaName,
                  totalExhibitionBudget: 0,
                  totalPRRecommended: 0,
                  exhibitionsCount: 0,
                  participatingExhibitions: []
                };
              }

              const exBudget = Number(item.exBudget) || 0;
              const prBudget = Number(item.prBudget) || 0;

              map[mediaName].totalExhibitionBudget += exBudget;
              map[mediaName].totalPRRecommended += prBudget;
              map[mediaName].exhibitionsCount += 1;
              map[mediaName].participatingExhibitions.push({
                exhibitionId: ex.id,
                exhibitionName: ex.name,
                department: ex.department,
                year: String(ex.year || '2027').trim(),
                exBudget,
                prBudget,
                startDate: item.startDate,
                endDate: item.endDate
              });
            });
          });

        return Object.values(map).sort((a, b) => b.totalPRRecommended - a.totalPRRecommended);
      }, [exhibitions, mediaSelectedYear]);

      const selectedMediaGroupList = useMemo(() => {
        return yearlyMediaProcurementPool.filter(m => selectedMediaNames.includes(m.mediaName));
      }, [yearlyMediaProcurementPool, selectedMediaNames]);

      const handleToggleMediaSelect = (mediaName) => {
        setSelectedMediaNames(prev => 
          prev.includes(mediaName) ? prev.filter(name => name !== mediaName) : [...prev, mediaName]
        );
      };

      const handleSelectAllMedia = () => {
        setSelectedMediaNames(yearlyMediaProcurementPool.map(m => m.mediaName));
      };

      const handleClearAllMedia = () => {
        setSelectedMediaNames([]);
      };

      // 依選定年份計算 KPI 達成狀況 (對照同年份活動加總)
      const calculatedMediaKpis = useMemo(() => {
        const targetYear = String(kpiSelectedYear).trim();
        const yearMediaTotals = {};
        exhibitions
          .filter(ex => String(ex.year || '2027').trim() === targetYear)
          .forEach(ex => {
            (ex.mediaItems || []).forEach(item => {
              const name = item.name ? item.name.trim().toLowerCase() : '';
              if (!name) return;
              yearMediaTotals[name] = (yearMediaTotals[name] || 0) + (Number(item.prBudget) || 0);
            });
          });

        return mediaKpis
          .filter(kpi => String(kpi.year || '2027').trim() === targetYear)
          .map(kpi => {
            const allocatedAmount = yearMediaTotals[kpi.name.trim().toLowerCase()] || 0;
            const target = Number(kpi.targetKpi) || 0;
            const percentage = target > 0 ? Math.round((allocatedAmount / target) * 100) : 0;

            return {
              ...kpi,
              allocatedAmount,
              percentage
            };
          });
      }, [mediaKpis, exhibitions, kpiSelectedYear]);

      const handleDeleteMediaKpi = (id) => {
        if (confirm('確定要刪除此媒體 KPI 追蹤嗎？')) {
          const updatedKpis = mediaKpis.filter(k => k.id !== id);
          saveCloudData(exhibitions, updatedKpis);
        }
      };

      // 開啟新增或編輯 KPI 彈跳視窗
      const handleOpenKpiModal = (kpi = null) => {
        if (kpi) {
          setEditingKpi(kpi);
          setKpiForm({
            year: String(kpi.year || kpiSelectedYear),
            name: kpi.name,
            targetKpi: kpi.targetKpi
          });
        } else {
          setEditingKpi(null);
          setKpiForm({
            year: String(kpiSelectedYear),
            name: '',
            targetKpi: ''
          });
        }
        setIsKpiModalOpen(true);
      };

      const handleSaveKpi = (e) => {
        e.preventDefault();
        if (!kpiForm.name.trim() || !kpiForm.year.trim()) return;
        const cleanYear = String(kpiForm.year).trim();
        const cleanName = kpiForm.name.trim();
        const targetVal = Number(kpiForm.targetKpi) || 0;

        let updatedKpis = [];
        if (editingKpi) {
          updatedKpis = mediaKpis.map(k =>
            k.id === editingKpi.id
              ? { ...k, year: cleanYear, name: cleanName, targetKpi: targetVal }
              : k
          );
        } else {
          const newItem = {
            id: 'KPI-' + Date.now(),
            year: cleanYear,
            name: cleanName,
            targetKpi: targetVal
          };
          updatedKpis = [...mediaKpis, newItem];
        }

        saveCloudData(exhibitions, updatedKpis);
        setKpiSelectedYear(cleanYear);
        setIsKpiSectionExpanded(true);
        setIsKpiModalOpen(false);
      };

      const handleOpenModal = (ex = null) => {
        if (ex) {
          setEditingExhibition(ex);
          setFormData({
            name: ex.name || '',
            department: ex.department || '',
            totalBudget: ex.totalBudget || '',
            year: String(ex.year || '2027'),
            notes: ex.notes || '',
            mediaItems: ex.mediaItems ? JSON.parse(JSON.stringify(ex.mediaItems)) : []
          });
        } else {
          setEditingExhibition(null);
          setFormData({
            name: '',
            department: '',
            totalBudget: '',
            year: exhibitionSelectedYear || '2027',
            notes: '',
            mediaItems: [
              { id: Date.now().toString(), name: '工商時報', exBudget: '', prBudget: '', startDate: '', endDate: '' }
            ]
          });
        }
        setIsModalOpen(true);
      };

      const handleAddMediaRow = () => {
        setFormData(prev => ({
          ...prev,
          mediaItems: [
            ...prev.mediaItems,
            { id: Date.now().toString(), name: '', exBudget: '', prBudget: '', startDate: '', endDate: '' }
          ]
        }));
      };

      const handleRemoveMediaRow = (id) => {
        setFormData(prev => ({
          ...prev,
          mediaItems: prev.mediaItems.filter(item => item.id !== id)
        }));
      };

      const handleMediaChange = (id, field, value) => {
        setFormData(prev => ({
          ...prev,
          mediaItems: prev.mediaItems.map(item => {
            if (item.id === id) {
              const updated = { ...item, [field]: value };
              if (field === 'exBudget' && (item.prBudget === '' || item.prBudget === item.exBudget)) {
                updated.prBudget = value;
              }
              return updated;
            }
            return item;
          })
        }));
      };

      const handleSaveExhibition = (e) => {
        e.preventDefault();
        if (!formData.name) {
          alert('請輸入活動名稱');
          return;
        }

        const cleanYear = String(formData.year || '2027').trim();

        const newExhibition = {
          id: editingExhibition ? editingExhibition.id : 'EX-' + Date.now(),
          name: formData.name,
          department: formData.department || '未指定',
          totalBudget: Number(formData.totalBudget) || 0,
          year: cleanYear,
          notes: formData.notes || '',
          mediaItems: formData.mediaItems.map(item => ({
            ...item,
            exBudget: Number(item.exBudget) || 0,
            prBudget: Number(item.prBudget) || 0
          }))
        };

        let updatedList = [];
        if (editingExhibition) {
          updatedList = exhibitions.map(ex => ex.id === editingExhibition.id ? newExhibition : ex);
        } else {
          updatedList = [...exhibitions, newExhibition];
        }

        saveCloudData(updatedList, mediaKpis);
        setExhibitionSelectedYear(cleanYear);
        setIsModalOpen(false);
      };

      const handleDeleteExhibition = (id) => {
        if (confirm('確定要刪除此活動規劃嗎？')) {
          const updatedList = exhibitions.filter(ex => ex.id !== id);
          saveCloudData(updatedList, mediaKpis);
        }
      };

      const handleExportCSV = () => {
        if (mediaProcurementPool.length === 0) {
          alert('目前沒有可匯出的媒體資料');
          return;
        }
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += "媒體名稱,意向活動數,公關組建議規劃總金額,原預算總金額,參與活動明細\n";

        mediaProcurementPool.forEach(m => {
          const exList = m.participatingExhibitions.map(e => `${e.exhibitionName}(${e.year}年-${e.department})`).join('; ');
          csvContent += `"${m.mediaName}",${m.exhibitionsCount},${m.totalPRRecommended},${m.totalExhibitionBudget},"${exList}"\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `TAITRA_Media_Procurement_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        link.remove();
      };

      // 💡 儀表板依據選定年份過濾資料
      const dashboardExhibitions = useMemo(() => {
        if (dashboardSelectedYear === 'ALL') return exhibitions;
        return exhibitions.filter(ex => String(ex.year || '2027').trim() === String(dashboardSelectedYear).trim());
      }, [exhibitions, dashboardSelectedYear]);

      const dashboardStats = useMemo(() => {
        let grandExBudget = 0;
        let grandPRBudget = 0;
        let grandTotalBudgetLimit = 0;
        const mediaSet = new Set();

        dashboardExhibitions.forEach(ex => {
          grandTotalBudgetLimit += Number(ex.totalBudget) || 0;
          (ex.mediaItems || []).forEach(item => {
            if (item.name && item.name.trim()) mediaSet.add(item.name.trim());
            grandExBudget += Number(item.exBudget) || 0;
            grandPRBudget += Number(item.prBudget) || 0;
          });
        });
        return {
          exhibitionsCount: dashboardExhibitions.length,
          mediaCount: mediaSet.size,
          grandExBudget,
          grandPRBudget,
          grandTotalBudgetLimit
        };
      }, [dashboardExhibitions]);

      // 💡 跨年度比較 (YoY) 數據計算
      // 1. 年度全活動總媒體預算量比較
      const yearlySummaryComparison = useMemo(() => {
        return availableYears.map((yr, idx) => {
          const yearExs = exhibitions.filter(ex => String(ex.year || '2027').trim() === yr);
          const totalLimit = yearExs.reduce((s, ex) => s + (Number(ex.totalBudget) || 0), 0);
          let totalEx = 0;
          let totalPR = 0;
          const mediaSet = new Set();

          yearExs.forEach(ex => {
            (ex.mediaItems || []).forEach(item => {
              if (item.name && item.name.trim()) mediaSet.add(item.name.trim());
              totalEx += Number(item.exBudget) || 0;
              totalPR += Number(item.prBudget) || 0;
            });
          });

          // 計算與前一年度相比的成長率
          let yoyPRChange = null;
          if (idx > 0) {
            const prevYr = availableYears[idx - 1];
            const prevExs = exhibitions.filter(ex => String(ex.year || '2027').trim() === prevYr);
            const prevPR = prevExs.reduce(
              (s, ex) => s + (ex.mediaItems || []).reduce((ms, m) => ms + (Number(m.prBudget) || 0), 0),
              0
            );
            if (prevPR > 0) {
              yoyPRChange = Math.round(((totalPR - prevPR) / prevPR) * 100);
            }
          }

          return {
            year: yr,
            exhibitionsCount: yearExs.length,
            mediaCount: mediaSet.size,
            totalLimit,
            totalEx,
            totalPR,
            yoyPRChange
          };
        });
      }, [exhibitions, availableYears]);

      // 2. 單一特定活動年度預算量比較 (自動去掉名稱中的 4 碼年份作為系列基準鍵，例如 "COMPUTEX 2026" 與 "COMPUTEX 2027" 會自動歸為同一系列)
      const normalizeActivityName = (name) => {
        if (!name) return '';
        return name.replace(/20\d{2}/g, '').replace(/\s+/g, ' ').trim();
      };

      const uniqueActivitySeries = useMemo(() => {
        const seriesMap = {};
        exhibitions.forEach(ex => {
          const baseName = normalizeActivityName(ex.name) || ex.name.trim();
          if (!seriesMap[baseName]) {
            seriesMap[baseName] = {
              baseName,
              recordsByYear: {}
            };
          }
          const yr = String(ex.year || '2027').trim();
          // 若同一年有同名活動則累加
          if (!seriesMap[baseName].recordsByYear[yr]) {
            seriesMap[baseName].recordsByYear[yr] = {
              year: yr,
              originalNames: [ex.name],
              department: ex.department,
              totalBudget: Number(ex.totalBudget) || 0,
              exBudgetTotal: 0,
              prBudgetTotal: 0,
              mediaBreakdown: {}
            };
          } else {
            seriesMap[baseName].recordsByYear[yr].originalNames.push(ex.name);
            seriesMap[baseName].recordsByYear[yr].totalBudget += Number(ex.totalBudget) || 0;
          }

          const targetRec = seriesMap[baseName].recordsByYear[yr];
          (ex.mediaItems || []).forEach(item => {
            const mName = item.name ? item.name.trim() : '';
            const exB = Number(item.exBudget) || 0;
            const prB = Number(item.prBudget) || 0;
            targetRec.exBudgetTotal += exB;
            targetRec.prBudgetTotal += prB;
            if (mName) {
              targetRec.mediaBreakdown[mName] = (targetRec.mediaBreakdown[mName] || 0) + prB;
            }
          });
        });

        return Object.values(seriesMap).sort((a, b) => a.baseName.localeCompare(b.baseName, 'zh-TW'));
      }, [exhibitions]);

      // 預設選取第一個可比較的活動系列
      useEffect(() => {
        if (uniqueActivitySeries.length > 0) {
          const exists = uniqueActivitySeries.some(s => s.baseName === compareActivityKey);
          if (!exists) {
            setCompareActivityKey(uniqueActivitySeries[0].baseName);
          }
        }
      }, [uniqueActivitySeries]);

      const selectedSeriesDetail = useMemo(() => {
        return uniqueActivitySeries.find(s => s.baseName === compareActivityKey) || null;
      }, [uniqueActivitySeries, compareActivityKey]);

      // 3. 媒體被投放歷年預算量比較矩陣
      const mediaYearlyComparisonMatrix = useMemo(() => {
        const mediaNamesSet = new Set();
        exhibitions.forEach(ex => {
          (ex.mediaItems || []).forEach(item => {

        const rows = Array.from(mediaNamesSet).map(mediaName => {

            let prSum = 0;
            let exCount = 0;
            exhibitions
              .filter(ex => String(ex.year || '2027').trim() === yr)
              .forEach(ex => {
                const matchedItems = (ex.mediaItems || []).filter(
                  item => item.name && item.name.trim().toLowerCase() === mediaName.toLowerCase()
                );
                if (matchedItems.length > 0) {
                  exCount += 1;
                  matchedItems.forEach(m => {
                    prSum += Number(m.prBudget) || 0;
                  });
                }
              });

            byYear[yr] = { prSum, exCount };
            grandTotalPR += prSum;
          });

          return {
            mediaName,
            byYear,
            grandTotalPR
          };
        });

        return rows.sort((a, b) => b.grandTotalPR - a.grandTotalPR);
      }, [exhibitions, availableYears]);

      const calculateTimelinePosition = (startStr, endStr, targetYear = '2027') => {
        if (!startStr || !endStr) return { left: '0%', width: '100%', isPlaceholder: true };
        const start = new Date(startStr);
        const end = new Date(endStr);
        const yearNum = /^\d{4}$/.test(String(targetYear)) ? String(targetYear) : '2027';
        const minDate = new Date(`${yearNum}-01-01`);
        const maxDate = new Date(`${yearNum}-12-31`);
        const totalSpan = maxDate - minDate;
        
        let leftPercent = ((start - minDate) / totalSpan) * 100;
        let widthPercent = ((end - start) / totalSpan) * 100;

        if (leftPercent < 0) leftPercent = 0;
        if (leftPercent > 100) leftPercent = 100;
        if (widthPercent < 2) widthPercent = 2;
        if (leftPercent + widthPercent > 100) widthPercent = 100 - leftPercent;

        return { left: `${leftPercent}%`, width: `${widthPercent}%`, isPlaceholder: false };
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}

                          ) : (

                                    const prevCell = row.byYear[availableYears[idx - 1]] || { prSum: 0 };
                                    if (prevCell.prSum > 0 && cell.prSum > 0) {
                                      const pct = Math.round(((cell.prSum - prevCell.prSum) / prevCell.prSum) * 100);
                                      if (pct > 0) {
                                        diffBadge = <span className="text-[10px] text-emerald-600 ml-1">(+{pct}%)</span>;
                                      } else if (pct < 0) {
                                        diffBadge = <span className="text-[10px] text-rose-600 ml-1">({pct}%)</span>;
                                      }
                                    }
                                  }

                                  return (
                                    <td key={yr} className="px-4 py-3 text-right">
                                      {cell.prSum > 0 ? (
                                        <div>
                                          <span className="font-bold text-blue-600">NT$ {cell.prSum.toLocaleString()}</span>
                                          {diffBadge}
                                          <span className="block text-[10px] text-slate-400">({cell.exCount} 展)</span>
                                        </div>
                                      ) : (
                                        <span className="text-slate-300 text-xs">-</span>
                                      )}
                                    </td>
                                  );
                                })}
                                <td className="px-4 py-3 text-right font-extrabold text-slate-900 bg-slate-50">
                                  NT$ {row.grandTotalPR.toLocaleString()}
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                {/* 4. 總體數據儀表板 (支援年份切換查看單一年度資料) */}
                {activeTab === 'dashboard' && (
                  <div className="space-y-6">
                    {/* 年度切換列 */}
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-3">
                      <div className="flex items-center flex-wrap gap-2">
                        <span className="text-sm font-bold text-slate-800 flex items-center">
                          <span className="mr-1.5">📅</span> 儀表板檢視年度：
                        </span>
                        <div className="flex items-center space-x-1 bg-slate-100 p-1 rounded-lg border border-slate-200">
                          {availableYears.map(yr => (
                            <button
                              key={yr}
                              type="button"
                              onClick={() => setDashboardSelectedYear(yr)}
                              className={`px-3 py-1 rounded-md text-xs font-bold transition-all ${
                                dashboardSelectedYear === yr
                                  ? 'bg-blue-600 text-white shadow-sm'
                                  : 'text-slate-600 hover:bg-white'
                              }`}
                            >
                              {yr}年
                            </button>
                          ))}
                          <button
                            type="button"
                            onClick={() => setDashboardSelectedYear('ALL')}
                            className={`px-3 py-1 rounded-md text-xs font-bold transition-all ${
                              dashboardSelectedYear === 'ALL'
                                ? 'bg-slate-800 text-white shadow-sm'
                                : 'text-slate-600 hover:bg-white'
                            }`}
                          >
                            全部年度
                          </button>
                        </div>
                      </div>

                      <span className="text-xs text-slate-500">
                        目前顯示：<strong className="text-blue-600">{dashboardSelectedYear === 'ALL' ? '所有登錄年度合計' : `${dashboardSelectedYear} 年度單一年度數據`}</strong>
                      </span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                      <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <span className="text-xs font-semibold text-slate-500">登錄展覽總數</span>
                        <div className="text-2xl font-bold text-slate-800 mt-1">{dashboardStats.exhibitionsCount} 個展覽</div>
                      </div>
                      <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <span className="text-xs font-semibold text-slate-500">涵蓋媒體總數</span>
                        <div className="text-2xl font-bold text-slate-800 mt-1">{dashboardStats.mediaCount} 家媒體</div>
                      </div>
                      <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <span className="text-xs font-semibold text-slate-500">預算總額上限合計</span>
                        <div className="text-2xl font-bold text-indigo-600 mt-1">NT$ {dashboardStats.grandTotalBudgetLimit.toLocaleString()}</div>
                      </div>
                      <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <span className="text-xs font-semibold text-slate-500">展覽處需求加總</span>
                        <div className="text-2xl font-bold text-blue-600 mt-1">NT$ {dashboardStats.grandExBudget.toLocaleString()}</div>
                      </div>
                      <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <span className="text-xs font-semibold text-slate-500">公關組建議加總</span>
                        <div className="text-2xl font-bold text-emerald-600 mt-1">NT$ {dashboardStats.grandPRBudget.toLocaleString()}</div>
                      </div>
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
                      <h3 className="font-bold text-slate-800 text-base">
                        📊 {dashboardSelectedYear === 'ALL' ? '全館各展覽' : `${dashboardSelectedYear} 年度各展覽`}媒體廣告投放走期甘特圖
                      </h3>
                      <div className="border border-slate-200 rounded-lg p-4 bg-slate-50/50 space-y-3">
                        <div className="flex justify-between text-[11px] text-slate-400 border-b pb-2 font-mono">
                          <span>01月</span><span>03月</span><span>05月</span><span>07月</span><span>09月</span><span>11月</span><span>12月</span>
                        </div>
                        {dashboardExhibitions.length > 0 ? (
                          <div className="space-y-4">
                            {dashboardExhibitions.map(ex => (
                              <div key={ex.id} className="space-y-1.5 border-b pb-3">
                                <div className="text-xs font-bold text-slate-800">{ex.name} <span className="font-normal text-slate-500">({ex.year || '2027'}年 - {ex.department})</span></div>
                                <div className="space-y-1">
                                  {(ex.mediaItems || []).map((item, idx) => {
                                    const pos = calculateTimelinePosition(item.startDate, item.endDate, ex.year || '2027');
                                    return (
                                      <div key={idx} className="relative h-6 bg-slate-200/60 rounded flex items-center px-2">
                                        <span className="text-[11px] font-semibold text-slate-700 z-10 truncate w-1/3">{item.name}</span>
                                        <div className="absolute inset-y-1 right-2 left-1/3 bg-slate-100 rounded overflow-hidden">
                                          {!pos.isPlaceholder && (
                                            <div className="absolute h-full bg-blue-600/85 rounded" style={{ left: pos.left, width: pos.width }}></div>
                                          )}
                                        </div>
                                      </div>
                                    );
                                  })}
                                </div>
                              </div>
                            ))}
                          </div>
                        ) : (
                          <div className="text-center py-8 text-xs text-slate-400">
                            此年度尚無展覽走期資料。
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                )}
              </>
            )}
          </main>

          {/* 新增 / 編輯 KPI 彈跳視窗 Modal */}
          {isKpiModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-xl max-w-md w-full overflow-hidden">
                <div className="p-5 bg-slate-50 border-b flex justify-between items-center">
                  <h3 className="font-bold text-slate-800 text-base">
                    {editingKpi ? '✏️ 編輯媒體 KPI 追蹤' : '➕ 新增媒體 KPI 追蹤'}
                  </h3>
                  <button type="button" onClick={() => setIsKpiModalOpen(false)} className="text-slate-400 font-bold text-xl px-2">✕</button>
                </div>
                <form onSubmit={handleSaveKpi} className="p-6 space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">所屬年份 * (可自行輸入)</label>
                    <input
                      type="text"
                      list="year-presets"
                      required
                      placeholder="例如：2027"
                      value={kpiForm.year}
                      onChange={(e) => setKpiForm({ ...kpiForm, year: e.target.value })}
                      className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg focus:ring-blue-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">媒體名稱 *</label>
                    <input
                      type="text"
                      list="media-presets"
                      required
                      placeholder="例如：自由時報"
                      value={kpiForm.name}
                      onChange={(e) => setKpiForm({ ...kpiForm, name: e.target.value })}
                      className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg focus:ring-blue-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">年度 KPI 目標 (NT$) *</label>
                    <input
                      type="number"
                      required
                      placeholder="例如：100000"
                      value={kpiForm.targetKpi}
                      onChange={(e) => setKpiForm({ ...kpiForm, targetKpi: e.target.value })}
                      className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg focus:ring-blue-500"
                    />
                  </div>
                  <div className="pt-2 flex justify-end space-x-2">
                    <button type="button" onClick={() => setIsKpiModalOpen(false)} className="px-4 py-2 text-xs text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
                    <button type="submit" className="px-4 py-2 text-xs bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow font-medium">儲存</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 新增 / 編輯展覽 Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl shadow-xl max-w-3xl w-full max-h-[90vh] flex flex-col overflow-hidden">
                <div className="p-5 bg-slate-50 border-b flex justify-between items-center">
                  <h3 className="font-bold text-slate-800 text-lg">{editingExhibition ? '✏️ 編輯活動媒體需求' : '➕ 新增活動媒體需求'}</h3>
                  <button type="button" onClick={() => setIsModalOpen(false)} className="text-slate-400 font-bold text-xl px-2">✕</button>
                </div>
                <form onSubmit={handleSaveExhibition} className="p-6 overflow-y-auto space-y-6 flex-1">
                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
                    <div className="sm:col-span-1">
                      <label className="block text-xs font-semibold text-slate-700 mb-1">所屬年份 * (可自填)</label>
                      <input
                        type="text"
                        list="year-presets"
                        required
                        placeholder="例如：2027"
                        value={formData.year}
                        onChange={(e) => setFormData({ ...formData, year: e.target.value })}
                        className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg focus:ring-blue-500"
                      />
                    </div>

                    <div className="sm:col-span-1">
                      <label className="block text-xs font-semibold text-slate-700 mb-1">活動名稱 *</label>
                      <input type="text" required placeholder="COMPUTEX" value={formData.name} onChange={(e) => setFormData({ ...formData, name: e.target.value })} className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg" />
                    </div>

                    <div className="sm:col-span-1">
                      <label className="block text-xs font-semibold text-slate-700 mb-1">承辦單位 *</label>
                      <input type="text" placeholder="展覽處展一組" value={formData.department} onChange={(e) => setFormData({ ...formData, department: e.target.value })} className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg" />
                    </div>

                    <div className="sm:col-span-1">
                      <label className="block text-xs font-semibold text-slate-700 mb-1">預算總額上限 (NT$)</label>
                      <input type="number" placeholder="1000000" value={formData.totalBudget} onChange={(e) => setFormData({ ...formData, totalBudget: e.target.value })} className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">備註說明</label>
                    <textarea rows="2" placeholder="宣傳重點..." value={formData.notes} onChange={(e) => setFormData({ ...formData, notes: e.target.value })} className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg"></textarea>
                  </div>

                  <div className="space-y-3 pt-2 border-t">
                    <div className="flex justify-between items-center">
                      <label className="text-sm font-bold text-slate-800">欲投放媒體與走期規劃</label>
                      <button type="button" onClick={handleAddMediaRow} className="text-xs bg-blue-50 text-blue-600 border border-blue-200 px-2.5 py-1 rounded font-medium">+ 新增媒體</button>
                    </div>
                    <div className="space-y-3">
                      {formData.mediaItems.map((item, idx) => (
                        <div key={item.id} className="p-3 bg-slate-50 rounded-xl border space-y-2">
                          <div className="flex justify-between items-center text-xs text-slate-500">
                            <span>媒體項目 #{idx + 1}</span>
                            {formData.mediaItems.length > 1 && <button type="button" onClick={() => handleRemoveMediaRow(item.id)} className="text-rose-600 font-semibold">✕ 移除</button>}
                          </div>
                          <div className="grid grid-cols-1 sm:grid-cols-4 gap-2">
                            <div>
                              <label className="block text-[11px] text-slate-500 mb-0.5">媒體名稱</label>
                              <input type="text" list="media-presets" placeholder="選擇媒體" value={item.name} onChange={(e) => handleMediaChange(item.id, 'name', e.target.value)} className="w-full text-xs p-2 bg-white border rounded" />
                            </div>
                            <div>
                              <label className="block text-[11px] text-slate-500 mb-0.5">原預算</label>
                              <input type="number" placeholder="0" value={item.exBudget} onChange={(e) => handleMediaChange(item.id, 'exBudget', e.target.value)} className="w-full text-xs p-2 bg-white border rounded" />
                            </div>
                            <div>
                              <label className="block text-[11px] text-slate-500 mb-0.5">公關建議金額</label>
                              <input type="number" placeholder="0" value={item.prBudget} onChange={(e) => handleMediaChange(item.id, 'prBudget', e.target.value)} className="w-full text-xs p-2 bg-white border rounded text-blue-600 font-semibold" />
                            </div>
                            <div>
                              <label className="block text-[11px] text-slate-500 mb-0.5">走期</label>
                              <div className="flex items-center space-x-1">
                                <input type="date" value={item.startDate} onChange={(e) => handleMediaChange(item.id, 'startDate', e.target.value)} className="w-1/2 text-[10px] p-1.5 bg-white border rounded" />
                                <span className="text-slate-400">~</span>
                                <input type="date" value={item.endDate} onChange={(e) => handleMediaChange(item.id, 'endDate', e.target.value)} className="w-1/2 text-[10px] p-1.5 bg-white border rounded" />
                              </div>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <datalist id="media-presets">
                    {dynamicMediaList.map(m => (<option key={m} value={m} />))}
                  </datalist>

                  <datalist id="year-presets">
                    {Array.from(new Set([...PRESET_YEARS, ...availableYears])).sort().map(y => (
                      <option key={y} value={y} />
                    ))}
                  </datalist>

                  <div className="pt-4 border-t flex justify-end space-x-3">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 text-sm text-slate-600 rounded-lg">取消</button>
                    <button type="submit" className="px-5 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow">儲存並同步至雲端</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <footer className="bg-slate-900 text-slate-400 py-4 border-t text-center text-xs">
            外貿協會公關組 媒體預算整合管理系統 &copy; {new Date().getFullYear()} Taiwan External Trade Development Council
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
