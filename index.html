<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外貿協會 - 媒體採購與預算整合管理系統</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/lucide-react@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; }
  </style>
  <!-- 網站書籤圖示 -->
<link rel="icon" type="image/png" href="./favicon.png">
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const PRESET_MEDIA_LIST = [
      "工商時報", "經濟日報", "數位時代", "商業周刊", 
      "天下雜誌", "今周刊", "中央社", "自由時報", 
      "聯合報", "中國時報", "Technice 科技島", "TechNews 科技新報",
      "Facebook / Instagram 廣告", "Google Search / Display 廣告", "LinkedIn 廣告"
    ];

    function App() {
      const [exhibitions, setExhibitions] = useState([]);
      const [activeTab, setActiveTab] = useState('exhibitions'); 
      const [selectedMediaName, setSelectedMediaName] = useState('');
      const [filteredExhibitionIds, setFilteredExhibitionIds] = useState([]);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingExhibition, setEditingExhibition] = useState(null);

      const [formData, setFormData] = useState({
        name: '',
        department: '',
        totalBudget: '',
        notes: '',
        mediaItems: []
      });

      useEffect(() => {
        const savedData = localStorage.getItem('taitra_media_procurement_data');
        if (savedData) {
          try {
            const parsed = JSON.parse(savedData);
            setExhibitions(parsed);
            setFilteredExhibitionIds(parsed.map(e => e.id));
          } catch (e) {
            console.error('Failed to parse storage', e);
          }
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('taitra_media_procurement_data', JSON.stringify(exhibitions));
      }, [exhibitions]);

      useEffect(() => {
        if (exhibitions.length > 0 && filteredExhibitionIds.length === 0) {
          setFilteredExhibitionIds(exhibitions.map(e => e.id));
        }
      }, [exhibitions]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const mediaProcurementPool = useMemo(() => {
        const map = {};
        exhibitions.forEach(ex => {
          (ex.mediaItems || []).forEach(item => {
            const mediaName = item.name ? item.name.trim() : '';
            if (!mediaName) return;

            if (!map[mediaName]) {
              map[mediaName] = {
                mediaName,
                totalExhibitionBudget: 0,
                totalPRRecommended: 0,
                exhibitionsCount: 0,
                participatingExhibitions: [],
                schedules: []
              };
            }

            const exBudget = Number(item.exBudget) || 0;
            const prBudget = Number(item.prBudget) || 0;

            map[mediaName].totalExhibitionBudget += exBudget;
            map[mediaName].totalPRRecommended += prBudget;
            map[mediaName].exhibitionsCount += 1;
            map[mediaName].participatingExhibitions.push({
              exhibitionId: ex.id,
              exhibitionName: ex.name,
              department: ex.department,
              exBudget,
              prBudget,
              startDate: item.startDate,
              endDate: item.endDate
            });

            if (item.startDate || item.endDate) {
              map[mediaName].schedules.push({
                exhibitionName: ex.name,
                start: item.startDate || '未定',
                end: item.endDate || '未定'
              });
            }
          });
        });

        return Object.values(map).sort((a, b) => b.totalExhibitionBudget - a.totalExhibitionBudget);
      }, [exhibitions]);

      useEffect(() => {
        if (mediaProcurementPool.length > 0 && !mediaProcurementPool.find(m => m.mediaName === selectedMediaName)) {
          setSelectedMediaName(mediaProcurementPool[0].mediaName);
        }
      }, [mediaProcurementPool]);

      const currentMediaGroup = useMemo(() => {
        return mediaProcurementPool.find(m => m.mediaName === selectedMediaName) || mediaProcurementPool[0] || null;
      }, [mediaProcurementPool, selectedMediaName]);

      const handleOpenModal = (ex = null) => {
        if (ex) {
          setEditingExhibition(ex);
          setFormData({
            name: ex.name || '',
            department: ex.department || '',
            totalBudget: ex.totalBudget || '',
            notes: ex.notes || '',
            mediaItems: ex.mediaItems ? JSON.parse(JSON.stringify(ex.mediaItems)) : []
          });
        } else {
          setEditingExhibition(null);
          setFormData({
            name: '',
            department: '',
            totalBudget: '',
            notes: '',
            mediaItems: [
              { id: Date.now().toString(), name: '工商時報', exBudget: '', prBudget: '', startDate: '', endDate: '' }
            ]
          });
        }
        setIsModalOpen(true);
      };

      const handleAddMediaRow = () => {
        setFormData(prev => ({
          ...prev,
          mediaItems: [
            ...prev.mediaItems,
            { id: Date.now().toString(), name: '', exBudget: '', prBudget: '', startDate: '', endDate: '' }
          ]
        }));
      };

      const handleRemoveMediaRow = (id) => {
        setFormData(prev => ({
          ...prev,
          mediaItems: prev.mediaItems.filter(item => item.id !== id)
        }));
      };

      const handleMediaChange = (id, field, value) => {
        setFormData(prev => ({
          ...prev,
          mediaItems: prev.mediaItems.map(item => {
            if (item.id === id) {
              const updated = { ...item, [field]: value };
              if (field === 'exBudget' && (item.prBudget === '' || item.prBudget === item.exBudget)) {
                updated.prBudget = value;
              }
              return updated;
            }
            return item;
          })
        }));
      };

      const handleSaveExhibition = (e) => {
        e.preventDefault();
        if (!formData.name) {
          alert('請輸入展覽名稱');
          return;
        }

        const newExhibition = {
          id: editingExhibition ? editingExhibition.id : 'EX-' + Date.now(),
          name: formData.name,
          department: formData.department || '未指定',
          totalBudget: Number(formData.totalBudget) || 0,
          notes: formData.notes || '',
          mediaItems: formData.mediaItems.map(item => ({
            ...item,
            exBudget: Number(item.exBudget) || 0,
            prBudget: Number(item.prBudget) || 0
          }))
        };

        if (editingExhibition) {
          setExhibitions(prev => prev.map(ex => ex.id === editingExhibition.id ? newExhibition : ex));
        } else {
          setExhibitions(prev => {
            const updatedList = [...prev, newExhibition];
            setFilteredExhibitionIds(updatedList.map(e => e.id));
            return updatedList;
          });
        }

        setIsModalOpen(false);
      };

      const handleDeleteExhibition = (id) => {
        if (confirm('確定要刪除此展覽規劃嗎？')) {
          setExhibitions(prev => prev.filter(ex => ex.id !== id));
          setFilteredExhibitionIds(prev => prev.filter(exId => exId !== id));
        }
      };

      const handleToggleFilter = (id) => {
        setFilteredExhibitionIds(prev => 
          prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]
        );
      };

      const handleSelectAllFilter = () => {
        setFilteredExhibitionIds(exhibitions.map(e => e.id));
      };

      const handleClearFilter = () => {
        setFilteredExhibitionIds([]);
      };

      const handleExportJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exhibitions, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `TAITRA_PR_Media_Procurement_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const handleImportJSON = (e) => {
        const fileReader = new FileReader();
        if (e.target.files && e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (Array.isArray(parsed)) {
                setExhibitions(parsed);
                setFilteredExhibitionIds(parsed.map(e => e.id));
                alert('成功匯入設定檔！');
              } else {
                alert('檔案格式不符');
              }
            } catch (err) {
              alert('讀取失敗');
            }
          };
        }
      };

      const handleExportCSV = () => {
        if (mediaProcurementPool.length === 0) {
          alert('目前沒有可匯出的媒體資料');
          return;
        }
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += "媒體名稱,意向展覽數,展覽處需求總金額,公關組建議總金額,參與展覽明細\n";

        mediaProcurementPool.forEach(m => {
          const exList = m.participatingExhibitions.map(e => `${e.exhibitionName}(${e.department})`).join('; ');
          csvContent += `"${m.mediaName}",${m.exhibitionsCount},${m.totalExhibitionBudget},${m.totalPRRecommended},"${exList}"\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `TAITRA_Media_Procurement_Summary_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        link.remove();
      };

      const handleLoadSampleData = () => {
        const sampleData = [
          {
            id: 'EX-SAMPLE-1',
            name: 'COMPUTEX 2027',
            department: '展覽處展二組',
            totalBudget: 1500000,
            notes: '著重 AI 伺服器與半導體供應鏈，需加強國際與本土財經媒體曝光。',
            mediaItems: [
              { id: 'm1', name: '工商時報', exBudget: 400000, prBudget: 450000, startDate: '2027-04-01', endDate: '2027-06-05' },
              { id: 'm2', name: '經濟日報', exBudget: 400000, prBudget: 450000, startDate: '2027-04-01', endDate: '2027-06-05' },
              { id: 'm3', name: '數位時代', exBudget: 300000, prBudget: 250000, startDate: '2027-05-01', endDate: '2027-06-05' },
              { id: 'm4', name: 'TechNews 科技新報', exBudget: 200000, prBudget: 200000, startDate: '2027-05-15', endDate: '2027-06-05' }
            ]
          },
          {
            id: 'EX-SAMPLE-2',
            name: 'TAISPO 台灣國際運動及健身展 2027',
            department: '展覽處展一組',
            totalBudget: 800000,
            notes: '主打智慧健身與戶外戶內運動科技，欲串聯財經報紙與社群廣告。',
            mediaItems: [
              { id: 'm5', name: '工商時報', exBudget: 250000, prBudget: 200000, startDate: '2027-02-01', endDate: '2027-03-25' },
              { id: 'm6', name: 'Facebook / Instagram 廣告', exBudget: 300000, prBudget: 350000, startDate: '2027-02-15', endDate: '2027-03-28' },
              { id: 'm7', name: '自由時報', exBudget: 200000, prBudget: 250000, startDate: '2027-03-01', endDate: '2027-03-27' }
            ]
          }
        ];
        setExhibitions(sampleData);
        setFilteredExhibitionIds(sampleData.map(e => e.id));
      };

      const handleClearAllData = () => {
        if (confirm('確定要清空所有展覽與媒體需求資料嗎？')) {
          setExhibitions([]);
          setFilteredExhibitionIds([]);
          setSelectedMediaName('');
        }
      };

      const overallStats = useMemo(() => {
        let grandExBudget = 0;
        let grandPRBudget = 0;
        let grandTotalBudgetLimit = 0;
        exhibitions.forEach(ex => {
          grandTotalBudgetLimit += Number(ex.totalBudget) || 0;
          (ex.mediaItems || []).forEach(item => {
            grandExBudget += Number(item.exBudget) || 0;
            grandPRBudget += Number(item.prBudget) || 0;
          });
        });
        return { grandExBudget, grandPRBudget, grandTotalBudgetLimit };
      }, [exhibitions]);

      const calculateTimelinePosition = (startStr, endStr) => {
        if (!startStr || !endStr) return { left: '0%', width: '100%', isPlaceholder: true };
        const start = new Date(startStr);
        const end = new Date(endStr);
        const minDate = new Date('2027-01-01');
        const maxDate = new Date('2027-12-31');
        const totalSpan = maxDate - minDate;
        
        let leftPercent = ((start - minDate) / totalSpan) * 100;
        let widthPercent = ((end - start) / totalSpan) * 100;

        if (leftPercent < 0) leftPercent = 0;
        if (leftPercent > 100) leftPercent = 100;
        if (widthPercent < 2) widthPercent = 2;
        if (leftPercent + widthPercent > 100) widthPercent = 100 - leftPercent;

        return { left: `${leftPercent}%`, width: `${widthPercent}%`, isPlaceholder: false };
      };

      const displayedExhibitions = useMemo(() => {
        return exhibitions.filter(ex => filteredExhibitionIds.includes(ex.id));
      }, [exhibitions, filteredExhibitionIds]);

      const sortedParticipatingExhibitions = useMemo(() => {
        if (!currentMediaGroup) return [];
        return [...currentMediaGroup.participatingExhibitions].sort((a, b) => {
          const dateA = a.startDate ? new Date(a.startDate).getTime() : Infinity;
          const dateB = b.startDate ? new Date(b.startDate).getTime() : Infinity;
          if (dateA !== dateB) return dateA - dateB;
          const endDateA = a.endDate ? new Date(a.endDate).getTime() : Infinity;
          const endDateB = b.endDate ? new Date(b.endDate).getTime() : Infinity;
          return endDateA - endDateB;
        });
      }, [currentMediaGroup]);

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-slate-900 text-white shadow-md border-b border-slate-800 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap justify-between items-center gap-4">
              <div className="flex items-center space-x-3">
                <div className="bg-blue-600 p-2 rounded-lg text-white font-bold text-xl tracking-wider shadow">
                  TAITRA
                </div>
                <div>
                  <h1 className="text-lg font-bold leading-tight">外貿協會公關組</h1>
                  <p className="text-xs text-slate-400">跨展覽媒體採購與預算整合管理系統</p>
                </div>
              </div>

              {/* Tabs */}
              <nav className="flex bg-slate-800 p-1 rounded-lg border border-slate-700">
                <button
                  onClick={() => setActiveTab('exhibitions')}
                  className={`px-4 py-1.5 rounded-md text-sm font-medium transition-all ${
                    activeTab === 'exhibitions' ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:text-white hover:bg-slate-700/50'
                  }`}
                >
                  依展覽 (需求管理)
                </button>
                <button
                  onClick={() => setActiveTab('media')}
                  className={`px-4 py-1.5 rounded-md text-sm font-medium transition-all ${
                    activeTab === 'media' ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:text-white hover:bg-slate-700/50'
                  }`}
                >
                  依媒體 (採購參考)
                </button>
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`px-4 py-1.5 rounded-md text-sm font-medium transition-all ${
                    activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:text-white hover:bg-slate-700/50'
                  }`}
                >
                  總體數據儀表板
                </button>
              </nav>

              {/* Action Buttons */}
              <div className="flex items-center space-x-2">
                <button
                  onClick={() => handleOpenModal()}
                  className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium flex items-center shadow transition-all"
                >
                  <span className="mr-1 text-base font-bold">+</span> 新增展覽
                </button>
                
                <div className="h-4 w-px bg-slate-700 mx-1"></div>

                <button onClick={handleExportCSV} title="匯出 CSV 報表" className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-medium">
                  匯出 CSV
                </button>
                <button onClick={handleExportJSON} title="匯出系統設定檔" className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-medium">
                  匯出 JSON
                </button>
                <label className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-medium cursor-pointer">
                  匯入 JSON
                  <input type="file" accept=".json" onChange={handleImportJSON} className="hidden" />
                </label>

                {exhibitions.length === 0 && (
                  <button onClick={handleLoadSampleData} className="bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1.5 rounded-lg text-xs font-medium shadow">
                    載入測試資料
                  </button>
                )}
                {exhibitions.length > 0 && (
                  <button onClick={handleClearAllData} className="bg-rose-900/60 hover:bg-rose-800 text-rose-200 border border-rose-700/50 px-2.5 py-1.5 rounded-lg text-xs font-medium">
                    清空
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

            {exhibitions.length === 0 && (
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-12 text-center my-8">
                <div className="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 font-bold text-2xl">
                  📋
                </div>
                <h3 className="text-xl font-bold text-slate-800 mb-2">目前尚無展覽媒體需求資料</h3>
                <p className="text-slate-500 text-sm max-w-md mx-auto mb-6">
                  點擊右上角的「新增展覽」開始登錄各個展覽處的媒體預算與走期；或點擊「載入測試資料」快速預覽系統功能。
                </p>
                <div className="flex justify-center space-x-3">
                  <button onClick={() => handleOpenModal()} className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg font-medium text-sm shadow">
                    + 開始新增展覽
                  </button>
                  <button onClick={handleLoadSampleData} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-5 py-2 rounded-lg font-medium text-sm">
                    載入測試範例資料
                  </button>
                </div>
              </div>
            )}

            {exhibitions.length > 0 && (
              <>
                {/* 1. 依展覽 (Exhibition View) */}
                {activeTab === 'exhibitions' && (
                  <div className="space-y-6">
                    {/* 多選篩選工具列 */}
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <span className="text-sm font-bold text-slate-800 flex items-center">
                          <span className="mr-2">🔍</span> 篩選顯示展覽：
                        </span>
                        <div className="flex items-center space-x-2">
                          <button onClick={handleSelectAllFilter} className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded border border-slate-300 font-medium">
                            全選
                          </button>
                          <button onClick={handleClearFilter} className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded border border-slate-300 font-medium">
                            全取消
                          </button>
                        </div>
                      </div>

                      <div className="flex flex-wrap gap-2 pt-1">
                        {exhibitions.map(ex => {
                          const isSelected = filteredExhibitionIds.includes(ex.id);
                          return (
                            <button
                              key={ex.id}
                              onClick={() => handleToggleFilter(ex.id)}
                              className={`px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all flex items-center space-x-1.5 ${
                                isSelected 
                                  ? 'bg-blue-50 border-blue-300 text-blue-700 shadow-sm' 
                                  : 'bg-slate-50 border-slate-200 text-slate-400 line-through'
                              }`}
                            >
                              <span>{ex.name}</span>
                              <span className="text-[10px] opacity-75">({ex.department})</span>
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    {/* 各展覽廣告走期圖表化 (甘特圖) */}
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
                      <h3 className="font-bold text-slate-800 text-base flex items-center">
                        <span className="mr-2">📊</span> 各展覽媒體廣告投放走期
                      </h3>

                      <div className="border border-slate-200 rounded-lg p-4 bg-slate-50/50 space-y-3">
                        <div className="flex justify-between text-[11px] text-slate-400 border-b border-slate-200 pb-2 font-mono">
                          <span>01月</span><span>03月</span><span>05月</span><span>07月</span><span>09月</span><span>11月</span><span>12月</span>
                        </div>

                        <div className="space-y-3">
                          {displayedExhibitions.map(ex => {
                            const sortedMediaItems = [...(ex.mediaItems || [])].sort((a, b) => {
                              const dateA = a.startDate ? new Date(a.startDate).getTime() : Infinity;
                              const dateB = b.startDate ? new Date(b.startDate).getTime() : Infinity;
                              if (dateA !== dateB) return dateA - dateB;
                              const endDateA = a.endDate ? new Date(a.endDate).getTime() : Infinity;
                              const endDateB = b.endDate ? new Date(b.endDate).getTime() : Infinity;
                              if (endDateA !== endDateB) return endDateA - endDateB;
                              return a.name.localeCompare(b.name, 'zh-TW');
                            });

                            return (
                              <div key={ex.id} className="space-y-1">
                                <div className="flex justify-between text-xs font-bold text-slate-700">
                                  <span>{ex.name} <span className="text-[11px] font-normal text-slate-500">({ex.department})</span></span>
                                </div>
                                <div className="space-y-1.5">

                            </div>

                            <div className="sm:col-span-1">
                              <label className="block text-[11px] text-slate-500 mb-0.5">展覽處預算 (NT$)</label>
                              <input
                                type="number"
                                placeholder="0"
                                value={item.exBudget}
                                onChange={(e) => handleMediaChange(item.id, 'exBudget', e.target.value)}
                                className="w-full text-xs p-2 bg-white border border-slate-300 rounded"
                              />
                            </div>

                            <div className="sm:col-span-1">
                              <label className="block text-[11px] text-slate-500 mb-0.5">公關組建議金額 (NT$)</label>
                              <input
                                type="number"
                                placeholder="0"
                                value={item.prBudget}
                                onChange={(e) => handleMediaChange(item.id, 'prBudget', e.target.value)}
                                className="w-full text-xs p-2 bg-white border border-slate-300 rounded text-blue-600 font-semibold"
                              />
                            </div>

                            <div className="sm:col-span-1">
                              <label className="block text-[11px] text-slate-500 mb-0.5">預定走期 (開始～結束)</label>
                              <div className="flex items-center space-x-1">
                                <input
                                  type="date"
                                  value={item.startDate}
                                  onChange={(e) => handleMediaChange(item.id, 'startDate', e.target.value)}
                                  className="w-1/2 text-[10px] p-1.5 bg-white border border-slate-300 rounded"
                                />
                                <span className="text-slate-400 text-xs">~</span>
                                <input
                                  type="date"
                                  value={item.endDate}
                                  onChange={(e) => handleMediaChange(item.id, 'endDate', e.target.value)}
                                  className="w-1/2 text-[10px] p-1.5 bg-white border border-slate-300 rounded"
                                />
                              </div>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <datalist id="media-presets">
                    {PRESET_MEDIA_LIST.map(m => (<option key={m} value={m} />))}
                  </datalist>

                  <div className="pt-4 border-t border-slate-200 flex justify-end space-x-3">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">
                      取消
                    </button>
                    <button type="submit" className="px-5 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow">
                      儲存展覽需求
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-slate-900 text-slate-400 py-4 border-t border-slate-800 text-center text-xs">
            外貿協會公關組 內部專用工具 &copy; {new Date().getFullYear()} Taiwan External Trade Development Council
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
