<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外貿協會公關組 - 媒體採購與預算整合管理系統 (GAS 雲端共編版)</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; }
  </style>
  <!-- 網站書籤圖示 -->
  <link rel="icon" type="image/png" href="./favicon.png">
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ⚠️ 請保留您原本正常運作的 GAS 網址
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzFYzNAij9SbKi83N3lQS5k__dVulfSzjZtoVeqFy7c1P-Gf-7U0F8KecSiw6FDGNtV/exec";

    const PRESET_MEDIA_LIST = [
      "工商時報", "經濟日報", "商業周刊", 
      "自由時報", "聯合報", "中國時報"
    ];

    function App() {
      const [exhibitions, setExhibitions] = useState([]);
      const [mediaKpis, setMediaKpis] = useState([]);

      // 💡 媒體年度 KPI 區塊收合狀態 (預設收合)
      const [isKpiSectionExpanded, setIsKpiSectionExpanded] = useState(false);

      // 💡 媒體甘特圖展開狀態
      const [expandedTimelineMedia, setExpandedTimelineMedia] = useState([]);
      
      // 💡 各活動卡片展開狀態 (預設空陣列 = 全部收合)
      const [expandedExhibitions, setExpandedExhibitions] = useState([]);

      // 💡 依年份群組的收合狀態 (紀錄哪些年份是展開的，預設包含所有年份)
      const [collapsedYears, setCollapsedYears] = useState([]);

      // 💡 拖曳排序狀態
      const [draggedIndex, setDraggedIndex] = useState(null);
      const [dragOverIndex, setDragOverIndex] = useState(null);

      const handleToggleExhibitionExpand = (exId) => {
        setExpandedExhibitions(prev => 
          prev.includes(exId) ? prev.filter(id => id !== exId) : [...prev, exId]
        );
      };

      // 切換年份群組的收合/展開
      const handleToggleYearCollapse = (year) => {
        setCollapsedYears(prev => 
          prev.includes(year) ? prev.filter(y => y !== year) : [...prev, year]
        );
      };

      // 拖拉排序處理
      const handleDragStart = (e, index) => {
        setDraggedIndex(index);
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', index.toString());
      };

      const handleDragOver = (e, index) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (dragOverIndex !== index) {
          setDragOverIndex(index);
        }
      };

      const handleDrop = (e, dropIndex) => {
        e.preventDefault();
        if (draggedIndex === null || draggedIndex === dropIndex) {
          setDraggedIndex(null);
          setDragOverIndex(null);
          return;
        }

        const updatedList = [...exhibitions];
        const [movedItem] = updatedList.splice(draggedIndex, 1);
        updatedList.splice(dropIndex, 0, movedItem);

        setDraggedIndex(null);
        setDragOverIndex(null);

        saveCloudData(updatedList, mediaKpis);
      };

      const handleDragEnd = () => {
        setDraggedIndex(null);
        setDragOverIndex(null);
      };

      const handleToggleTimeline = (mediaName) => {
        setExpandedTimelineMedia(prev => 
          prev.includes(mediaName) ? prev.filter(name => name !== mediaName) : [...prev, mediaName]
        );
      };

      const [activeTab, setActiveTab] = useState('exhibitions'); 

      // 💡 依媒體視角多選狀態：預設全取消 (空陣列)
      const [selectedMediaNames, setSelectedMediaNames] = useState([]);

      const [isLoading, setIsLoading] = useState(false);
      const [isSaving, setIsSaving] = useState(false);
      const [syncStatus, setSyncStatus] = useState('已連線至雲端資料庫');

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingExhibition, setEditingExhibition] = useState(null);

      // 編輯 KPI 彈跳視窗狀態
      const [isKpiModalOpen, setIsKpiModalOpen] = useState(false);
      const [editingKpi, setEditingKpi] = useState(null);
      const [kpiForm, setKpiForm] = useState({ name: '', targetKpi: '' });

      const [formData, setFormData] = useState({
        name: '',
        department: '',
        totalBudget: '',
        year: '2027', // 預設年份
        notes: '',
        mediaItems: []
      });

      const [newKpiName, setNewKpiName] = useState('');
      const [newKpiTarget, setNewKpiTarget] = useState('');

      // 動態媒體清單
      const dynamicMediaList = useMemo(() => {
        const mediaSet = new Set(PRESET_MEDIA_LIST);
        exhibitions.forEach(ex => {
          (ex.mediaItems || []).forEach(item => {
            if (item.name && item.name.trim() !== '') {
              mediaSet.add(item.name.trim());
            }
          });
        });
        mediaKpis.forEach(kpi => {
          if (kpi.name && kpi.name.trim() !== '') {
            mediaSet.add(kpi.name.trim());
          }
        });
        return Array.from(mediaSet);
      }, [exhibitions, mediaKpis]);

      // 取得所有出現過的年份清單 (自動排序)
      const availableYears = useMemo(() => {
        const yearsSet = new Set(['2026', '2027', '2028']);
        exhibitions.forEach(ex => {
          if (ex.year) yearsSet.add(String(ex.year));
        });
        return Array.from(yearsSet).sort().reverse(); // 讓最新的年份排在前面
      }, [exhibitions]);

      const fetchCloudData = async () => {
        if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('YOUR_SCRIPT_ID_HERE')) {
          setSyncStatus('尚未設定 GAS URL (目前使用單機模式)');
          return;
        }
        setIsLoading(true);
        setSyncStatus('正在同步雲端資料...');
        try {
          const res = await fetch(GAS_WEB_APP_URL);
          const data = await res.json();
          if (Array.isArray(data)) {
            setExhibitions(data);
          } else if (data && typeof data === 'object') {
            if (Array.isArray(data.exhibitions)) {
              setExhibitions(data.exhibitions);
            }
            if (Array.isArray(data.mediaKpis)) {
              setMediaKpis(data.mediaKpis);
            }
          }
          setSyncStatus('雲端資料已是最新狀態');
        } catch (err) {
          console.error('Fetch error:', err);
          setSyncStatus('雲端連線失敗，請檢查網路或 GAS URL 設定');
        } finally {
          setIsLoading(false);
        }
      };

      const saveCloudData = async (newExhibitions, newKpis = mediaKpis) => {
        setExhibitions(newExhibitions);
        setMediaKpis(newKpis);

        const payload = {
          exhibitions: newExhibitions,
          mediaKpis: newKpis
        };

        if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('YOUR_SCRIPT_ID_HERE')) {
          localStorage.setItem('taitra_media_procurement_data', JSON.stringify(newExhibitions));
          localStorage.setItem('taitra_media_kpi_data', JSON.stringify(newKpis));
          return;
        }

        setIsSaving(true);
        setSyncStatus('正在寫入 Google Sheet 雲端資料庫...');
        try {
          await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          setSyncStatus('雲端共編資料庫同步成功！');
        } catch (err) {
          console.error('Save error:', err);
          setSyncStatus('寫入失敗，請稍後再試');
        } finally {
          setIsSaving(false);
        }
      };

      useEffect(() => {
        fetchCloudData();
      }, []);

      const mediaProcurementPool = useMemo(() => {
        const map = {};
        exhibitions.forEach(ex => {
          (ex.mediaItems || []).forEach(item => {
            const mediaName = item.name ? item.name.trim() : '';
            if (!mediaName) return;

            if (!map[mediaName]) {
              map[mediaName] = {
                mediaName,
                totalExhibitionBudget: 0,
                totalPRRecommended: 0,
                exhibitionsCount: 0,
                participatingExhibitions: []
              };
            }

            const exBudget = Number(item.exBudget) || 0;
            const prBudget = Number(item.prBudget) || 0;

            map[mediaName].totalExhibitionBudget += exBudget;
            map[mediaName].totalPRRecommended += prBudget;
            map[mediaName].exhibitionsCount += 1;
            map[mediaName].participatingExhibitions.push({
              exhibitionId: ex.id,
              exhibitionName: ex.name,
              department: ex.department,
              year: ex.year || '2027',
              exBudget,
              prBudget,
              startDate: item.startDate,
              endDate: item.endDate
            });
          });
        });

        return Object.values(map).sort((a, b) => b.totalPRRecommended - a.totalPRRecommended);
      }, [exhibitions]);

      const selectedMediaGroupList = useMemo(() => {
        return mediaProcurementPool.filter(m => selectedMediaNames.includes(m.mediaName));
      }, [mediaProcurementPool, selectedMediaNames]);

      const handleToggleMediaSelect = (mediaName) => {
        setSelectedMediaNames(prev => 
          prev.includes(mediaName) ? prev.filter(name => name !== mediaName) : [...prev, mediaName]
        );
      };

      const handleSelectAllMedia = () => {
        setSelectedMediaNames(mediaProcurementPool.map(m => m.mediaName));
      };

      const handleClearAllMedia = () => {
        setSelectedMediaNames([]);
      };

      const calculatedMediaKpis = useMemo(() => {
        return mediaKpis.map(kpi => {
          const found = mediaProcurementPool.find(m => m.mediaName.toLowerCase() === kpi.name.toLowerCase());
          const allocatedAmount = found ? found.totalPRRecommended : 0;
          const target = Number(kpi.targetKpi) || 0;
          const percentage = target > 0 ? Math.round((allocatedAmount / target) * 100) : 0;

          return {
            ...kpi,
            allocatedAmount,
            percentage
          };
        });
      }, [mediaKpis, mediaProcurementPool]);

      const handleAddMediaKpi = (e) => {
        e.preventDefault();
        if (!newKpiName.trim()) return;
        const newItem = {
          id: 'KPI-' + Date.now(),
          name: newKpiName.trim(),
          targetKpi: Number(newKpiTarget) || 0
        };
        const updatedKpis = [...mediaKpis, newItem];
        saveCloudData(exhibitions, updatedKpis);
        setNewKpiName('');
        setNewKpiTarget('');
      };

      const handleDeleteMediaKpi = (id) => {
        if (confirm('確定要刪除此媒體 KPI 追蹤嗎？')) {
          const updatedKpis = mediaKpis.filter(k => k.id !== id);
          saveCloudData(exhibitions, updatedKpis);
        }
      };

      const handleOpenKpiModal = (kpi) => {
        setEditingKpi(kpi);
        setKpiForm({ name: kpi.name, targetKpi: kpi.targetKpi });
        setIsKpiModalOpen(true);
      };

      const handleSaveKpiEdit = (e) => {
        e.preventDefault();
        if (!kpiForm.name.trim()) return;
        const updatedKpis = mediaKpis.map(k => k.id === editingKpi.id ? { ...k, name: kpiForm.name.trim(), targetKpi: Number(kpiForm.targetKpi) || 0 } : k);
        saveCloudData(exhibitions, updatedKpis);
        setIsKpiModalOpen(false);
      };

      const handleOpenModal = (ex = null) => {
        if (ex) {
          setEditingExhibition(ex);
          setFormData({
            name: ex.name || '',
            department: ex.department || '',
            totalBudget: ex.totalBudget || '',
            year: ex.year || '2027',
            notes: ex.notes || '',
            mediaItems: ex.mediaItems ? JSON.parse(JSON.stringify(ex.mediaItems)) : []
          });
        } else {
          setEditingExhibition(null);
          setFormData({
            name: '',
            department: '',
            totalBudget: '',
            year: '2027',
            notes: '',
            mediaItems: [
              { id: Date.now().toString(), name: '工商時報', exBudget: '', prBudget: '', startDate: '', endDate: '' }
            ]
          });
        }
        setIsModalOpen(true);
      };

      const handleAddMediaRow = () => {
        setFormData(prev => ({
          ...prev,
          mediaItems: [
            ...prev.mediaItems,
            { id: Date.now().toString(), name: '', exBudget: '', prBudget: '', startDate: '', endDate: '' }
          ]
        }));
      };

      const handleRemoveMediaRow = (id) => {
        setFormData(prev => ({
          ...prev,
          mediaItems: prev.mediaItems.filter(item => item.id !== id)
        }));
      };

      const handleMediaChange = (id, field, value) => {
        setFormData(prev => ({
          ...prev,
          mediaItems: prev.mediaItems.map(item => {
            if (item.id === id) {
              const updated = { ...item, [field]: value };
              if (field === 'exBudget' && (item.prBudget === '' || item.prBudget === item.exBudget)) {
                updated.prBudget = value;
              }
              return updated;
            }
            return item;
          })
        }));
      };

      const handleSaveExhibition = (e) => {
        e.preventDefault();
        if (!formData.name) {
          alert('請輸入活動名稱');
          return;
        }

        const newExhibition = {
          id: editingExhibition ? editingExhibition.id : 'EX-' + Date.now(),
          name: formData.name,
          department: formData.department || '未指定',
          totalBudget: Number(formData.totalBudget) || 0,
          year: formData.year || '2027',
          notes: formData.notes || '',
          mediaItems: formData.mediaItems.map(item => ({
            ...item,
            exBudget: Number(item.exBudget) || 0,
            prBudget: Number(item.prBudget) || 0
          }))
        };

        let updatedList = [];
        if (editingExhibition) {
          updatedList = exhibitions.map(ex => ex.id === editingExhibition.id ? newExhibition : ex);
        } else {
          updatedList = [...exhibitions, newExhibition];
        }

        saveCloudData(updatedList, mediaKpis);
        setIsModalOpen(false);
      };

      const handleDeleteExhibition = (id) => {
        if (confirm('確定要刪除此活動規劃嗎？')) {
          const updatedList = exhibitions.filter(ex => ex.id !== id);
          saveCloudData(updatedList, mediaKpis);
        }
      };

      const handleExportCSV = () => {
        if (mediaProcurementPool.length === 0) {
          alert('目前沒有可匯出的媒體資料');
          return;
        }
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += "媒體名稱,意向活動數,公關組建議規劃總金額,原預算總金額,參與活動明細\n";

        mediaProcurementPool.forEach(m => {
          const exList = m.participatingExhibitions.map(e => `${e.exhibitionName}(${e.year}年-${e.department})`).join('; ');
          csvContent += `"${m.mediaName}",${m.exhibitionsCount},${m.totalPRRecommended},${m.totalExhibitionBudget},"${exList}"\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `TAITRA_Media_Procurement_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        link.remove();
      };

      const overallStats = useMemo(() => {
        let grandExBudget = 0;
        let grandPRBudget = 0;
        let grandTotalBudgetLimit = 0;
        exhibitions.forEach(ex => {
          grandTotalBudgetLimit += Number(ex.totalBudget) || 0;
          (ex.mediaItems || []).forEach(item => {
            grandExBudget += Number(item.exBudget) || 0;
            grandPRBudget += Number(item.prBudget) || 0;
          });
        });
        return { grandExBudget, grandPRBudget, grandTotalBudgetLimit };
      }, [exhibitions]);

      const calculateTimelinePosition = (startStr, endStr) => {
        if (!startStr || !endStr) return { left: '0%', width: '100%', isPlaceholder: true };
        const start = new Date(startStr);
        const end = new Date(endStr);
        const minDate = new Date('2027-01-01');
        const maxDate = new Date('2027-12-31');
        const totalSpan = maxDate - minDate;
        
        let leftPercent = ((start - minDate) / totalSpan) * 100;
        let widthPercent = ((end - start) / totalSpan) * 100;

        if (leftPercent < 0) leftPercent = 0;
        if (leftPercent > 100) leftPercent = 100;
        if (widthPercent < 2) widthPercent = 2;
        if (leftPercent + widthPercent > 100) widthPercent = 100 - leftPercent;

        return { left: `${leftPercent}%`, width: `${widthPercent}%`, isPlaceholder: false };
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-slate-900 text-white shadow-md border-b border-slate-800 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap justify-between items-center gap-4">
              <div className="flex items-center space-x-3">
                <div className="bg-blue-600 p-2 rounded-lg text-white font-bold text-xl tracking-wider shadow">
                  TAITRA
                </div>
                <div>
                  <h1 className="text-lg font-bold leading-tight">外貿協會公關組</h1>
                  <div className="flex items-center space-x-2 text-xs text-slate-400">
                    <span>媒體採購與預算整合管理系統</span>
                    <span className="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-1.5 py-0.5 rounded text-[10px]">
                      ☁️ Google Sheet 共編中
                    </span>
                  </div>
                </div>
              </div>

              {/* Tabs */}
              <nav className="flex bg-slate-800 p-1 rounded-lg border border-slate-700">
                <button
                  onClick={() => setActiveTab('exhibitions')}
                  className={`px-4 py-1.5 rounded-md text-sm font-medium transition-all ${
                    activeTab === 'exhibitions' ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:text-white'
                  }`}
                >
                  依活動 (預算分配)
                </button>
                <button
                  onClick={() => setActiveTab('media')}
                  className={`px-4 py-1.5 rounded-md text-sm font-medium transition-all ${
                    activeTab === 'media' ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:text-white'
                  }`}
                >
                  依媒體 (採購參考)
                </button>
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`px-4 py-1.5 rounded-md text-sm font-medium transition-all ${
                    activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:text-white'
                  }`}
                >
                  總體數據儀表板
                </button>
              </nav>

              {/* Actions & Status */}
              <div className="flex items-center space-x-2">
                <button
                  onClick={() => fetchCloudData()}
                  title="重新從 Google Sheet 抓取最新共編資料"
                  className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-medium flex items-center space-x-1"
                >
                  <span>🔄</span>
                  <span>{isLoading ? '同步中...' : '重新整理'}</span>
                </button>

                <button
                  onClick={() => handleOpenModal()}
                  className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium flex items-center shadow transition-all"
                >
                  <span className="mr-1 text-base font-bold">+</span> 新增活動
                </button>

                <button onClick={handleExportCSV} title="匯出 CSV 報表" className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-medium">
                  匯出
                </button>
              </div>
            </div>

            {/* 即時連線狀態標示條 */}
            <div className="bg-slate-800/80 px-4 py-1 text-[11px] text-slate-300 flex justify-between items-center border-t border-slate-800">
              <span>雲端狀態：{syncStatus}</span>
              {isSaving && <span className="text-amber-400 font-bold">⚡ 正在寫入 Google Sheet...</span>}
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

            {exhibitions.length === 0 && !isLoading && (
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-12 text-center my-8">
                <div className="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 font-bold text-2xl">
                  📋
                </div>
                <h3 className="text-xl font-bold text-slate-800 mb-2">目前尚無活動媒體需求資料</h3>
                <p className="text-slate-500 text-sm max-w-md mx-auto mb-6">
                  點擊右上角「新增活動」，所有輸入的資料都會自動即時同步給全組同仁！
                </p>
                <button onClick={() => handleOpenModal()} className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg font-medium text-sm shadow">
                  + 開始新增第一個活動廣宣需求
                </button>
              </div>
            )}

            {exhibitions.length > 0 && (
              <>
                {/* 1. 依活動 (預算分配管理頁面) */}
                {activeTab === 'exhibitions' && (
                  <div className="space-y-6">
                    {/* 媒體年度 KPI 需求與分配追蹤區塊 (可收合) */}
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                      <div 
                        onClick={() => setIsKpiSectionExpanded(!isKpiSectionExpanded)}
                        className="p-4 bg-slate-50 hover:bg-slate-100/80 transition-colors cursor-pointer flex items-center justify-between border-b border-slate-200 select-none"
                      >
                        <div className="flex items-center space-x-2">
                          <button className="text-xs bg-white text-slate-600 border border-slate-300 w-6 h-6 rounded-md font-bold flex items-center justify-center shadow-sm">
                            {isKpiSectionExpanded ? "▼" : "▶"}
                          </button>
                          <h3 className="font-bold text-slate-800 text-base flex items-center">
                            <span className="mr-2">🎯</span> 媒體年度 KPI 需求與預算分配追蹤
                          </h3>
                          <span className="text-xs text-slate-500 bg-slate-200/70 px-2 py-0.5 rounded-full font-medium">

                      </div>
                      <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <span className="text-xs font-semibold text-slate-500">預算總額上限合計</span>
                        <div className="text-2xl font-bold text-indigo-600 mt-1">NT$ {overallStats.grandTotalBudgetLimit.toLocaleString()}</div>
                      </div>
                      <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <span className="text-xs font-semibold text-slate-500">展覽處需求加總</span>
                        <div className="text-2xl font-bold text-blue-600 mt-1">NT$ {overallStats.grandExBudget.toLocaleString()}</div>
                      </div>
                      <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <span className="text-xs font-semibold text-slate-500">公關組建議加總</span>
                        <div className="text-2xl font-bold text-emerald-600 mt-1">NT$ {overallStats.grandPRBudget.toLocaleString()}</div>
                      </div>
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
                      <h3 className="font-bold text-slate-800 text-base">📊 全館各展覽媒體廣告投放走期甘特圖</h3>
                      <div className="border border-slate-200 rounded-lg p-4 bg-slate-50/50 space-y-3">
                        <div className="flex justify-between text-[11px] text-slate-400 border-b pb-2 font-mono">
                          <span>01月</span><span>03月</span><span>05月</span><span>07月</span><span>09月</span><span>11月</span><span>12月</span>
                        </div>
                        <div className="space-y-4">
                          {exhibitions.map(ex => (
                            <div key={ex.id} className="space-y-1.5 border-b pb-3">
                              <div className="text-xs font-bold text-slate-800">{ex.name} <span className="font-normal text-slate-500">({ex.year || '2027'}年 - {ex.department})</span></div>
                              <div className="space-y-1">
                                {(ex.mediaItems || []).map((item, idx) => {
                                  const pos = calculateTimelinePosition(item.startDate, item.endDate);
                                  return (
                                    <div key={idx} className="relative h-6 bg-slate-200/60 rounded flex items-center px-2">
                                      <span className="text-[11px] font-semibold text-slate-700 z-10 truncate w-1/3">{item.name}</span>
                                      <div className="absolute inset-y-1 right-2 left-1/3 bg-slate-100 rounded overflow-hidden">
                                        {!pos.isPlaceholder && (
                                          <div className="absolute h-full bg-blue-600/85 rounded" style={{ left: pos.left, width: pos.width }}></div>
                                        )}
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </>
            )}
          </main>

          {/* 編輯 KPI 彈跳視窗 Modal */}
          {isKpiModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-xl max-w-md w-full overflow-hidden">
                <div className="p-5 bg-slate-50 border-b flex justify-between items-center">
                  <h3 className="font-bold text-slate-800 text-base">✏️ 編輯媒體 KPI 追蹤</h3>
                  <button onClick={() => setIsKpiModalOpen(false)} className="text-slate-400 font-bold text-xl px-2">✕</button>
                </div>
                <form onSubmit={handleSaveKpiEdit} className="p-6 space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">媒體名稱 *</label>
                    <input type="text" required value={kpiForm.name} onChange={(e) => setKpiForm({ ...kpiForm, name: e.target.value })} className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">KPI 額度 (NT$) *</label>
                    <input type="number" required value={kpiForm.targetKpi} onChange={(e) => setKpiForm({ ...kpiForm, targetKpi: e.target.value })} className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg" />
                  </div>
                  <div className="pt-2 flex justify-end space-x-2">
                    <button type="button" onClick={() => setIsKpiModalOpen(false)} className="px-4 py-2 text-xs text-slate-600 hover:bg-slate-100 rounded-lg">取消</button>
                    <button type="submit" className="px-4 py-2 text-xs bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow">儲存</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 新增 / 編輯展覽 Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl shadow-xl max-w-3xl w-full max-h-[90vh] flex flex-col overflow-hidden">
                <div className="p-5 bg-slate-50 border-b flex justify-between items-center">
                  <h3 className="font-bold text-slate-800 text-lg">{editingExhibition ? '✏️ 編輯活動媒體需求' : '➕ 新增活動媒體需求'}</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 font-bold text-xl px-2">✕</button>
                </div>
                <form onSubmit={handleSaveExhibition} className="p-6 overflow-y-auto space-y-6 flex-1">
                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
                    <div className="sm:col-span-1">
                      <label className="block text-xs font-semibold text-slate-700 mb-1">所屬年份 *</label>
                      <select
                        value={formData.year}
                        onChange={(e) => setFormData({ ...formData, year: e.target.value })}
                        className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg focus:ring-blue-500"
                      >
                        <option value="2026">2026 年</option>
                        <option value="2027">2027 年</option>
                        <option value="2028">2028 年</option>
                        <option value="2029">2029 年</option>
                      </select>
                    </div>

                    <div className="sm:col-span-1">
                      <label className="block text-xs font-semibold text-slate-700 mb-1">活動名稱 *</label>
                      <input type="text" required placeholder="COMPUTEX" value={formData.name} onChange={(e) => setFormData({ ...formData, name: e.target.value })} className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg" />
                    </div>

                    <div className="sm:col-span-1">
                      <label className="block text-xs font-semibold text-slate-700 mb-1">承辦單位 *</label>
                      <input type="text" placeholder="展覽處展一組" value={formData.department} onChange={(e) => setFormData({ ...formData, department: e.target.value })} className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg" />
                    </div>

                    <div className="sm:col-span-1">
                      <label className="block text-xs font-semibold text-slate-700 mb-1">預算總額上限 (NT$)</label>
                      <input type="number" placeholder="1000000" value={formData.totalBudget} onChange={(e) => setFormData({ ...formData, totalBudget: e.target.value })} className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">備註說明</label>
                    <textarea rows="2" placeholder="宣傳重點..." value={formData.notes} onChange={(e) => setFormData({ ...formData, notes: e.target.value })} className="w-full text-sm p-2.5 bg-slate-50 border rounded-lg"></textarea>
                  </div>

                  <div className="space-y-3 pt-2 border-t">
                    <div className="flex justify-between items-center">
                      <label className="text-sm font-bold text-slate-800">欲投放媒體與走期規劃</label>
                      <button type="button" onClick={handleAddMediaRow} className="text-xs bg-blue-50 text-blue-600 border border-blue-200 px-2.5 py-1 rounded font-medium">+ 新增媒體</button>
                    </div>
                    <div className="space-y-3">
                      {formData.mediaItems.map((item, idx) => (
                        <div key={item.id} className="p-3 bg-slate-50 rounded-xl border space-y-2">
                          <div className="flex justify-between items-center text-xs text-slate-500">
                            <span>媒體項目 #{idx + 1}</span>
                            {formData.mediaItems.length > 1 && <button type="button" onClick={() => handleRemoveMediaRow(item.id)} className="text-rose-600 font-semibold">✕ 移除</button>}
                          </div>
                          <div className="grid grid-cols-1 sm:grid-cols-4 gap-2">
                            <div>
                              <label className="block text-[11px] text-slate-500 mb-0.5">媒體名稱</label>
                              <input type="text" list="media-presets" placeholder="選擇媒體" value={item.name} onChange={(e) => handleMediaChange(item.id, 'name', e.target.value)} className="w-full text-xs p-2 bg-white border rounded" />
                            </div>
                            <div>
                              <label className="block text-[11px] text-slate-500 mb-0.5">原預算</label>
                              <input type="number" placeholder="0" value={item.exBudget} onChange={(e) => handleMediaChange(item.id, 'exBudget', e.target.value)} className="w-full text-xs p-2 bg-white border rounded" />
                            </div>
                            <div>
                              <label className="block text-[11px] text-slate-500 mb-0.5">公關建議金額</label>
                              <input type="number" placeholder="0" value={item.prBudget} onChange={(e) => handleMediaChange(item.id, 'prBudget', e.target.value)} className="w-full text-xs p-2 bg-white border rounded text-blue-600 font-semibold" />
                            </div>
                            <div>
                              <label className="block text-[11px] text-slate-500 mb-0.5">走期</label>
                              <div className="flex items-center space-x-1">
                                <input type="date" value={item.startDate} onChange={(e) => handleMediaChange(item.id, 'startDate', e.target.value)} className="w-1/2 text-[10px] p-1.5 bg-white border rounded" />
                                <span className="text-slate-400">~</span>
                                <input type="date" value={item.endDate} onChange={(e) => handleMediaChange(item.id, 'endDate', e.target.value)} className="w-1/2 text-[10px] p-1.5 bg-white border rounded" />
                              </div>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <datalist id="media-presets">
                    {dynamicMediaList.map(m => (<option key={m} value={m} />))}
                  </datalist>

                  <div className="pt-4 border-t flex justify-end space-x-3">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 text-sm text-slate-600 rounded-lg">取消</button>
                    <button type="submit" className="px-5 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow">儲存並同步至雲端</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <footer className="bg-slate-900 text-slate-400 py-4 border-t text-center text-xs">
            外貿協會公關組 媒體預算整合管理系統 &copy; {new Date().getFullYear()} Taiwan External Trade Development Council
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
